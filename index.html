<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1425">
<meta name="description" content="Xuan Weather 台灣氣象監測中心｜全螢幕即時氣象觀測地圖">
<title>Xuan Weather｜台灣氣象監測中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-glass: rgba(255, 255, 255, 0.88);
  --bg-glass-strong: rgba(255, 255, 255, 0.95);
  --ink: #14243a;
  --muted: #64758c;
  --line: rgba(125, 151, 183, 0.25);
  --accent: #1d5d9c;
  --accent-soft: #e8f1ff;
  --shadow: 0 14px 36px rgba(15, 37, 68, 0.16);
}
body:not(.light) {
  --bg-glass: rgba(14, 27, 46, 0.86);
  --bg-glass-strong: rgba(18, 34, 56, 0.95);
  --ink: #e7f0fb;
  --muted: #9aadc5;
  --line: rgba(130, 162, 198, 0.24);
  --accent: #38bdf8;
  --accent-soft: rgba(56, 189, 248, 0.16);
  --shadow: 0 14px 36px rgba(3, 10, 22, 0.45);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: #0b1425;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

#xuan-map {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  z-index: 1;
  background: #dfe9f3;
}
#xuan-map .xuan-light-gray-base {
  filter: brightness(1.055) saturate(.82) contrast(.94);
}

.xw-top-left {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  left: max(14px, env(safe-area-inset-left));
  z-index: 900;
  width: min(360px, calc(100vw - 28px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.xw-top-left > * { pointer-events: auto; }
.xw-glass {
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.xw-brand-bar {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.xw-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.xw-logo {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: linear-gradient(145deg, #1d4ed8, #38bdf8);
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.28);
}
.xw-brand strong {
  display: block;
  font-size: 14px;
  font-weight: 850;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.xw-brand small {
  display: block;
  font-size: 9px;
  letter-spacing: .12em;
  color: var(--muted);
  font-weight: 700;
}
.xw-bar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.xw-icon-btn {
  height: 34px;
  padding: 0 10px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--bg-glass-strong);
  font-size: 12px;
  font-weight: 750;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.xw-icon-btn:hover { border-color: var(--accent); }
.xw-icon-btn:disabled { opacity: .6; cursor: wait; }

.xw-status-strip {
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
}
.updated[data-state="connected"] { color: #15803d; font-weight: 750; }
body:not(.light) .updated[data-state="connected"] { color: #4ade80; }
.updated[data-state="error"] { color: #dc2626; font-weight: 750; }

.xw-local-card {
  padding: 14px;
}
.location.xuan-location-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.xuan-location-title {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
  font-size: 13px;
}
.xuan-location-title b { font-size: 14px; }
#location-label { color: var(--muted); font-size: 12px; }
#gps-button {
  height: 32px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.xuan-gps-status {
  margin-top: 6px;
  font-size: 11px;
  color: var(--muted);
  line-height: 1.45;
}
.xuan-gps-status[data-state="error"] { color: #dc2626; }
.weather-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
}
.temperature {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
}
.temperature small {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0;
  margin-left: 2px;
  vertical-align: top;
}
.condition { font-size: 12px; font-weight: 750; margin-top: 4px; }
.feels { font-size: 10px; color: var(--muted); margin-top: 2px; }
.weather-icon { font-size: 38px; line-height: 1; }
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  margin-top: 10px;
}
.metric {
  padding: 7px 6px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(128, 155, 190, 0.08);
  text-align: center;
}
.metric label { display: block; font-size: 10px; color: var(--muted); }
.metric strong { display: block; font-size: 13px; font-weight: 850; margin-top: 2px; }
.metric em { font-style: normal; font-size: 10px; color: var(--muted); margin-left: 1px; }

.xw-top-center {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 900;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 999px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
.xw-top-center button {
  border: 0;
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 750;
  background: transparent;
  white-space: nowrap;
  transition: .18s ease;
}
.xw-top-center button.active {
  background: #1d5d9c;
  color: #fff;
  box-shadow: 0 4px 12px rgba(29, 93, 156, 0.35);
}
body:not(.light) .xw-top-center button.active {
  background: #0284c7;
  color: #fff;
}

.xw-drawer-btn {
  position: fixed;
  top: max(14px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
  z-index: 920;
  height: 40px;
  padding: 0 15px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-glass-strong);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  font-size: 12px;
  font-weight: 850;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.xw-drawer {
  position: fixed;
  top: calc(max(14px, env(safe-area-inset-top)) + 48px);
  right: max(14px, env(safe-area-inset-right));
  bottom: calc(max(14px, env(safe-area-inset-bottom)) + 54px);
  width: min(410px, calc(100vw - 28px));
  z-index: 910;
  border-radius: 22px;
  background: var(--bg-glass-strong);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: none;
  flex-direction: column;
  overflow: hidden;
}
.xw-drawer.open { display: flex; }
.xw-drawer-tabs {
  display: flex;
  gap: 4px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.xw-drawer-tabs button {
  flex: 1 0 auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 750;
  background: transparent;
}
.xw-drawer-tabs button.active {
  background: #1d5d9c;
  border-color: #1d5d9c;
  color: #fff;
}
.xw-drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
}
.xw-tab-pane { display: none; }
.xw-tab-pane.active { display: block; }

.xuan-rank-tabs {
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 10px;
}
.xuan-rank-tabs button {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 750;
  background: transparent;
}
.xuan-rank-tabs button.active {
  background: #1d5d9c;
  border-color: #1d5d9c;
  color: #fff;
}
.xuan-ranking-list, .xuan-region-list, .xuan-weather-brief {
  display: grid;
  gap: 6px;
}
.xuan-rank-row {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  padding: 7px 6px;
  border-bottom: 1px solid var(--line);
}
.xuan-rank-number {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 850;
  background: var(--accent-soft);
  color: var(--accent);
}
.xuan-rank-station b { display: block; font-size: 12px; }
.xuan-rank-station small { display: block; font-size: 10px; color: var(--muted); }
.xuan-rank-value { font-size: 13px; font-weight: 850; font-variant-numeric: tabular-nums; }
.xuan-region-row {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr) 52px;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}
.xuan-region-track {
  height: 8px;
  border-radius: 999px;
  background: rgba(128, 155, 190, 0.18);
  overflow: hidden;
}
.xuan-region-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #38bdf8, #1d5d9c);
}
.xuan-region-value { text-align: right; font-weight: 800; }
.xuan-insight-note, .xuan-data-coverage {
  margin-top: 10px;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.5;
}
.xuan-brief-item {
  display: flex;
  gap: 8px;
  padding: 9px 10px;
  border-radius: 12px;
  background: rgba(128, 155, 190, 0.1);
  font-size: 11px;
  line-height: 1.5;
}
#station-search {
  width: 100%;
  padding: 9px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg-glass);
  font-size: 12px;
  margin-bottom: 10px;
}
.xw-station-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.xw-station-card {
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(128, 155, 190, 0.06);
  text-align: left;
  transition: .15s ease;
}
.xw-station-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.xw-station-card strong { display: block; font-size: 12px; }
.xw-station-card small { display: block; font-size: 10px; color: var(--muted); }
.xw-station-card .temp { font-size: 18px; font-weight: 900; margin: 4px 0; }
.xw-station-card .meta { font-size: 10px; color: var(--muted); line-height: 1.45; }

.xw-bottom-bar {
  position: fixed;
  bottom: max(12px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 900;
  max-width: calc(100vw - 140px);
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11px;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.xw-bottom-bar::-webkit-scrollbar { display: none; }
.xw-ticker-item { display: inline-flex; align-items: center; gap: 4px; }
.xw-ticker-item strong { font-weight: 850; font-variant-numeric: tabular-nums; }
.xw-ticker-item em { font-style: normal; color: var(--muted); font-size: 10px; }

.xuan-fullscreen-control { border: 0 !important; box-shadow: none !important; background: transparent !important; }
.xuan-fullscreen-button {
  display: grid !important; place-items: center; width: 38px !important; height: 38px !important;
  border: 1px solid var(--line) !important; border-radius: 10px !important;
  background: var(--bg-glass-strong) !important; color: var(--ink) !important;
  font-size: 22px !important; font-weight: 600; line-height: 1 !important;
  text-decoration: none !important; box-shadow: var(--shadow);
}
.leaflet-control-zoom a {
  background: var(--bg-glass-strong) !important;
  color: var(--ink) !important;
  border-color: var(--line) !important;
}
.leaflet-control-layers {
  background: var(--bg-glass-strong) !important;
  color: var(--ink) !important;
  border: 1px solid var(--line) !important;
  border-radius: 14px !important;
  box-shadow: var(--shadow) !important;
}

.xuan-gps-marker-wrap { background: transparent !important; border: 0 !important; }
.xuan-gps-marker { position: relative; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
.xuan-gps-dot { position: relative; width: 14px; height: 14px; border-radius: 50%; background: #4285f4; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.55); z-index: 2; }
.xuan-gps-pulse { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: rgba(66,133,244,.22); border: 1px solid rgba(66,133,244,.48); animation: xuanGpsPulse 1.8s ease-out infinite; z-index: 1; }
@keyframes xuanGpsPulse { 0% { transform: scale(.65); opacity: .75; } 70% { transform: scale(1.45); opacity: .18; } 100% { transform: scale(1.6); opacity: 0; } }
.xuan-gps-accuracy-breath { animation: xuanGpsAccuracyBreath 2.2s ease-in-out infinite; }
@keyframes xuanGpsAccuracyBreath { 0%,100% { stroke-opacity: .48; fill-opacity: .07; } 50% { stroke-opacity: 1; fill-opacity: .19; } }

.xuan-station-tooltip {
  background: transparent !important; border: 0 !important; box-shadow: none !important;
  padding: 0 !important; margin: 0 !important; color: #fff !important;
  text-align: center; white-space: nowrap; pointer-events: none !important;
}
.xuan-station-tooltip::before { display: none !important; }
.xuan-station-label-name, .xuan-station-label-value {
  display: block; width: max-content; max-width: 112px; margin: 0 auto; padding: 1px 4px;
  border-radius: 3px; color: #fff; font-size: 10px; font-weight: 800; line-height: 1.25;
  text-shadow: -1px -1px 2px #263342, 1px -1px 2px #263342, -1px 1px 2px #263342, 1px 1px 2px #263342, 0 1px 4px #172536;
}
.xuan-station-label-value { font-weight: 900; }
#xuan-map .xuan-station-tooltip { display: none !important; }
#xuan-map.xuan-show-station-labels .xuan-station-tooltip { display: block !important; visibility: visible; }
#xuan-map.xuan-show-station-labels .xuan-station-tooltip.xuan-label-overlap { visibility: hidden !important; }

.xuan-floating-legend {
  min-width: 112px; max-width: 138px; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: 13px;
  background: var(--bg-glass-strong); color: var(--ink);
  box-shadow: var(--shadow); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); font-size: 11px; line-height: 1.45;
}
.xuan-floating-legend-title { margin-bottom: 6px; font-size: 12px; font-weight: 800; }
.xuan-floating-legend-bar { height: 9px; width: 100%; margin: 4px 0 5px; border-radius: 8px; }
.xuan-floating-legend-labels { display: flex; justify-content: space-between; gap: 5px; font-size: 10px; font-weight: 700; color: var(--muted); }
.xuan-floating-legend-rows { display: grid; gap: 5px; }
.xuan-floating-legend-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.xuan-floating-legend-swatch { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 50%; border: 1px solid rgba(40,55,75,.18); }

@media (max-width: 760px) {
  .xw-top-center {
    top: auto;
    bottom: calc(max(12px, env(safe-area-inset-bottom)) + 48px);
    left: 50%;
    transform: translateX(-50%);
  }
  .xw-bottom-bar {
    max-width: calc(100vw - 24px);
    padding: 7px 12px;
    gap: 10px;
  }
  .xw-local-card .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
</style>
</head>
<body>
  <div id="xuan-map" role="application" aria-label="台灣即時氣象監測地圖"></div>

  <div class="xw-top-left">
    <div class="xw-glass xw-brand-bar">
      <div class="xw-brand">
        <div class="xw-logo">🌦️</div>
        <div>
          <strong>Xuan Weather</strong>
          <small>TAIWAN WEATHER MAP</small>
        </div>
      </div>
      <div class="xw-bar-actions">
        <button class="xw-icon-btn" id="refresh-weather" type="button" title="重新整理觀測資料">🔄</button>
        <button class="xw-icon-btn" id="theme" type="button" title="切換深淺色">☼</button>
        <button class="xw-icon-btn" id="toggle-local-card" type="button" title="收合/展開所在地天氣">📍</button>
      </div>
    </div>

    <div class="xw-glass xw-status-strip">
      <span class="updated" role="status" aria-live="polite">● 正在連線</span>
      <span id="xw-station-count">-- 站</span>
    </div>

    <section class="xw-glass xw-local-card" id="xw-local-card">
      <div class="location">
        📍 <b>所在地天氣</b> 臺灣・位置待選
      </div>
      <div class="weather-summary">
        <div>
          <div class="temperature">--<small>°C</small></div>
          <div class="condition">等待官方觀測資料</div>
          <div class="feels">體感溫度 -- ｜ 觀測時間 --</div>
        </div>
        <div class="weather-icon">🌤️</div>
      </div>
      <div class="metrics">
        <div class="metric"><label>相對濕度</label><strong>--<em>%</em></strong></div>
        <div class="metric"><label>平均風速</label><strong>--<em>m/s</em></strong></div>
        <div class="metric"><label>最大陣風</label><strong>--<em>m/s</em></strong></div>
        <div class="metric"><label>累積雨量</label><strong>--<em>mm</em></strong></div>
      </div>
    </section>
  </div>

  <div class="xw-top-center" role="group" aria-label="地圖氣象圖層">
    <button type="button" data-map="temperature" class="active">🌡️ 氣溫</button>
    <button type="button" data-map="rain">🌧️ 雨量</button>
    <button type="button" data-map="wind">💨 風速</button>
  </div>

  <button class="xw-drawer-btn" id="xw-drawer-toggle" type="button" aria-expanded="false">
    🏆 排行・測站
  </button>

  <aside class="xw-drawer" id="xw-drawer" aria-label="即時氣象排行與測站面板">
    <div class="xw-drawer-tabs" role="tablist">
      <button type="button" class="active" data-tab="rankings">🏆 即時排行</button>
      <button type="button" data-tab="regions">🧭 區域分析</button>
      <button type="button" data-tab="stations">🔍 測站列表</button>
    </div>
    <div class="xw-drawer-body">
      <div class="xw-tab-pane active" id="tab-rankings">
        <div class="xuan-rank-tabs" role="group" aria-label="選擇排行榜">
          <button type="button" class="active" data-rank="hot">高溫</button>
          <button type="button" class="active" data-rank="cold">低溫</button>
          <button type="button" data-rank="gust">陣風</button>
          <button type="button" data-rank="rain">雨量</button>
          <button type="button" data-rank="wind">風速</button>
        </div>
        <div id="xuan-ranking-list" class="xuan-ranking-list">等待測站資料載入</div>

function number(value) {
  if (value === null || value === undefined || value === '') return null;
  const n = Number(value);
  return Number.isFinite(n) && n > -90 ? n : null;
}

function fmt(value, digits = 1) {
  const n = number(value);
  return n === null ? '--' : n.toFixed(digits);
}

function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  })[c]);
}

function formatTime(value) {
  if (!value) return '--';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '--';
  return d.toLocaleString('zh-TW', {
    timeZone: 'Asia/Taipei',
    hour12: false
  });
}

/* 測站資料解析 */

function parseStation(raw) {
  const w = raw.WeatherElement || {};

  const coord = raw.GeoInfo?.Coordinates?.find(
    item => item.CoordinateName === 'WGS84'
  );

  return {
    id: raw.StationId || '',
    name: raw.StationName || '未知測站',
    county: raw.GeoInfo?.CountyName || '',
    town: raw.GeoInfo?.TownName || '',
    lat: number(coord?.StationLatitude),
    lon: number(coord?.StationLongitude),
    time: raw.ObsTime?.DateTime || '',
    weather: w.Weather || '無資料',
    temperature: number(w.AirTemperature),
    humidity: number(w.RelativeHumidity),
    wind: number(w.WindSpeed),
    gust: number(w.GustInfo?.PeakGustSpeed),
    rain: number(w.Now?.Precipitation)
  };
}

function average(key) {
  const values = stations.map(s => s[key]).filter(v => v !== null);
  return values.length
    ? values.reduce((a, b) => a + b, 0) / values.length
    : null;
}

function maximum(key) {
  const values = stations.map(s => s[key]).filter(v => v !== null);
  return values.length ? Math.max(...values) : null;
}

/* 載入外部地圖程式 */

function loadCss(id, url) {
  return new Promise(resolve => {
    if ($('#' + id)) {
      resolve();
      return;
    }

    const link = document.createElement('link');
    link.id = id;
    link.rel = 'stylesheet';
    link.href = url;
    link.onload = resolve;
    link.onerror = resolve;
    document.head.appendChild(link);
  });
}

function loadScript(id, url) {
  return new Promise((resolve, reject) => {
    if ($('#' + id)) {
      if (window.L) resolve();
      else {
        const existing = $('#' + id);
        existing.addEventListener('load', resolve, { once:true });
        existing.addEventListener('error', reject, { once:true });
      }
      return;
    }

    const script = document.createElement('script');
    script.id = id;
    script.src = url;
    script.onload = resolve;
    script.onerror = () => reject(new Error('程式載入失敗：' + url));
    document.head.appendChild(script);
  });
}

async function loadLeaflet() {

/* 地圖圖層數值與顏色 */

function getMapValue(station) {
  if (mapMetric === 'rain') return station.rain;
  if (mapMetric === 'wind') return station.wind;
  return station.temperature;
}

// 氣溫色階參照中央氣象署《月氣溫面化圖 顏色－數值對照表》
// 官方文件列出 0～38°C、每 2°C 一級；以下 HEX 為依官方圖例視覺取樣的近似值，
// 並非氣象署公布的原始 RGB 色碼，也不代表官方測站圓點圖專用色碼。
const CWA_TEMP_COLOR_STOPS = [
  [0,  '#08798A'],
  [2,  '#16899A'],
  [4,  '#2999A9'],
  [6,  '#48AAB6'],
  [8,  '#70C0CA'],
  [10, '#A1DCE0'],
  [12, '#078F55'],
  [14, '#149E5C'],
  [16, '#2EAA61'],
  [18, '#55B96B'],
  [20, '#7BC978'],
  [22, '#A0D985'],
  [24, '#C1E694'],
  [26, '#E5EEA0'],
  [28, '#F6E18A'],
  [30, '#F5C05D'],
  [32, '#F49A30'],
  [34, '#EE4C50'],
  [36, '#A60026'],
  [38, '#7D2691']
];

function getCwaTemperatureColor(value) {
  const temperature = Number(value);
  if (!Number.isFinite(temperature)) return '#8993a3';

  // 使用官方圖例的 2°C 分級，不做 RGB 平滑內插。
  const level = Math.max(0, Math.min(38, Math.round(temperature / 2) * 2));
  const stop = CWA_TEMP_COLOR_STOPS.find(item => item[0] === level);
  return stop ? stop[1] : '#8993a3';
}

function getColor(value) {
  if (value === null || value === undefined || !Number.isFinite(Number(value))) {
    return '#8993a3';
  }

  if (mapMetric === 'rain') {
    if (value >= 20) return '#8438bf';
    if (value >= 10) return '#2867cf';
    if (value > 0) return '#35a7d8';
    return '#78b98b';
  }

  if (mapMetric === 'wind') {
    if (value >= 10) return '#983db5';
    if (value >= 6) return '#e18b35';
    if (value >= 3) return '#3289c9';
    return '#55a987';
  }

  return getCwaTemperatureColor(value);
}

/* 初始化地圖 */

function initMap() {
  if (!window.L || weatherMap) return;

  weatherMap = L.map('xuan-map', {
    scrollWheelZoom:false,
    preferCanvas:true,
    attributionControl:false,
    zoomControl:false
  }).setView([23.7,120.9],7);

  // 保留原本 OpenStreetMap 作為預設底圖，另提供 CartoDB 淺色簡約底圖切換。
  const osmBaseLayer = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom:18,
      attribution:'&copy; OpenStreetMap contributors'
    }
  );

  // Esri World Imagery：衛星影像底圖，保留真實地表影像色彩與細節。
  // 使用公開 ArcGIS 瓦片服務，不使用 CARTO API Key。
  const esriSatelliteBaseLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      maxZoom:19,
      attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'
    }
  );

  // 預設仍使用原本 OpenStreetMap；切換淺色底圖時不影響測站資料圖層。
  osmBaseLayer.addTo(weatherMap);

  L.control.layers(
    {
      '目前底圖（OpenStreetMap）':osmBaseLayer,
      '衛星影像底圖（Esri）':esriSatelliteBaseLayer
    },
    null,
    {
      collapsed:true,
      position:'bottomleft'
    }
  ).addTo(weatherMap);

  // 全螢幕控制：支援原生 Fullscreen API；不支援時使用 CSS 全螢幕備援。
  const fullscreenControl = L.control({position:'bottomright'});
  fullscreenControl.onAdd = function() {
    const container = L.DomUtil.create('div','leaflet-bar xuan-fullscreen-control');
    const button = L.DomUtil.create('a','xuan-fullscreen-button',container);
    button.href = '#';
    button.setAttribute('role','button');
    button.setAttribute('aria-label','開啟全螢幕');
    button.setAttribute('title','開啟全螢幕');
    button.textContent = '⛶';
    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.on(button,'click',async function(event) {
      L.DomEvent.preventDefault(event);
      const mapElement = document.getElementById('xuan-map');
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (mapElement.classList.contains('xuan-map-fullscreen')) {
          mapElement.classList.remove('xuan-map-fullscreen');
          document.body.classList.remove('xuan-map-fullscreen-active');
        } else if (mapElement.requestFullscreen) {
          await mapElement.requestFullscreen();
        } else {
          mapElement.classList.add('xuan-map-fullscreen');
          document.body.classList.add('xuan-map-fullscreen-active');
        }
      } catch (error) {
        mapElement.classList.toggle('xuan-map-fullscreen');
        document.body.classList.toggle('xuan-map-fullscreen-active',mapElement.classList.contains('xuan-map-fullscreen'));
      }
      const active = Boolean(document.fullscreenElement) || mapElement.classList.contains('xuan-map-fullscreen');
      button.textContent = active ? '↙' : '⛶';
      button.setAttribute('aria-label',active ? '退出全螢幕' : '開啟全螢幕');
      button.setAttribute('title',active ? '退出全螢幕' : '開啟全螢幕');
      setTimeout(() => weatherMap.invalidateSize(),180);
    });
    document.addEventListener('fullscreenchange',() => {
      const active = Boolean(document.fullscreenElement) || document.getElementById('xuan-map')?.classList.contains('xuan-map-fullscreen');
      button.textContent = active ? '↙' : '⛶';
      button.setAttribute('aria-label',active ? '退出全螢幕' : '開啟全螢幕');
      button.setAttribute('title',active ? '退出全螢幕' : '開啟全螢幕');
      setTimeout(() => weatherMap.invalidateSize(),180);
    });
    return container;
  };
  fullscreenControl.addTo(weatherMap);

  // Leaflet 右下角控制項依加入順序排列；縮放最後加入，顯示在全螢幕按鈕上方。
  L.control.zoom({position:'bottomright'}).addTo(weatherMap);

  // 衛星影像底圖行政區界線：鄉鎮市區淺灰細線、縣市外圍白色粗線。
  // 圖資來源：內政部國土測繪中心開放資料。
  let townshipBoundaryLayer = null;
  let countyBoundaryLayer = null;
  let boundaryLoading = false;
  let boundaryLoaded = false;

  const boundaryPane = weatherMap.createPane('xuanAdminBoundaryPane');
  boundaryPane.style.zIndex = '350';
  boundaryPane.style.pointerEvents = 'none';

  async function toggleSatelliteBoundaries(show) {
    if (!show) {
      if (townshipBoundaryLayer && weatherMap.hasLayer(townshipBoundaryLayer)) weatherMap.removeLayer(townshipBoundaryLayer);
      if (countyBoundaryLayer && weatherMap.hasLayer(countyBoundaryLayer)) weatherMap.removeLayer(countyBoundaryLayer);
      return;
    }
    if (!boundaryLoaded && !boundaryLoading) {
      boundaryLoading = true;
      try {
        const [townResponse, countyResponse] = await Promise.all([
          fetch('https://geo.maderaojen.me/datasets/tw-townships/releases/v1/2026-07-04.1/data.geojson'),
          fetch('https://geo.maderaojen.me/datasets/tw-counties/releases/v1/2026-08-07.1/data.geojson')
        ]);
        if (!townResponse.ok || !countyResponse.ok) throw new Error('行政區界線圖資載入失敗');
        const [townGeoJson, countyGeoJson] = await Promise.all([townResponse.json(), countyResponse.json()]);
        townshipBoundaryLayer = L.geoJSON(townGeoJson, {
          pane:'xuanAdminBoundaryPane', interactive:false,
          style:() => ({color:'#d5dce5',weight:0.75,opacity:0.92,fill:false,fillOpacity:0})
        });
        countyBoundaryLayer = L.geoJSON(countyGeoJson, {
          pane:'xuanAdminBoundaryPane', interactive:false,
          style:() => ({color:'#ffffff',weight:2.5,opacity:0.98,fill:false,fillOpacity:0})
        });
        boundaryLoaded = true;
      } catch (error) {
        console.warn('Xuan Weather 行政區界線載入失敗：', error);
      } finally {
        boundaryLoading = false;
      }
    }
    if (boundaryLoaded) {
      if (townshipBoundaryLayer && !weatherMap.hasLayer(townshipBoundaryLayer)) townshipBoundaryLayer.addTo(weatherMap);
      if (countyBoundaryLayer && !weatherMap.hasLayer(countyBoundaryLayer)) countyBoundaryLayer.addTo(weatherMap);
    }
  }

  weatherMap.on('baselayerchange', event => {
    toggleSatelliteBoundaries(event.layer === esriSatelliteBaseLayer);
  });

  // 右上角懸浮圖例，會依目前選取的地圖圖層同步更新
  const legendControl = L.control({ position:'topleft' });
  legendControl.onAdd = function() {
    const container = L.DomUtil.create('div', 'xuan-floating-legend');
    container.id = 'xuan-floating-legend';
    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);
    return container;
  };
  legendControl.addTo(weatherMap);
  updateMapLegend();

  // 全臺總覽時先隱藏密集標籤；從初始第 7 級開始，需放大約 4 級至第 11 級才顯示。
  function syncStationLabelVisibility() {
    const mapElement = document.getElementById('xuan-map');
    if (!mapElement) return;
    const show = weatherMap.getZoom() >= 11;
    mapElement.classList.toggle('xuan-show-station-labels',show);
    if (!show) {
      mapElement.querySelectorAll('.xuan-station-tooltip').forEach(el => el.classList.remove('xuan-label-overlap'));
      return;
    }
    // 等待 Leaflet 完成標籤排版，再逐一避開已顯示標籤的範圍。
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const mapRect = mapElement.getBoundingClientRect();
      const labels = Array.from(mapElement.querySelectorAll('.xuan-station-tooltip'));
      labels.forEach(el => el.classList.remove('xuan-label-overlap'));
      const centerX = mapRect.left + mapRect.width / 2;
      const centerY = mapRect.top + mapRect.height / 2;
      labels.sort((a,b) => {
        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        const pa = a.dataset.selected === '1' ? -1e9 : Math.hypot((ra.left+ra.right)/2-centerX,(ra.top+ra.bottom)/2-centerY);
        const pb = b.dataset.selected === '1' ? -1e9 : Math.hypot((rb.left+rb.right)/2-centerX,(rb.top+rb.bottom)/2-centerY);
        return pa-pb;
      });
      const accepted = [];
      labels.forEach(el => {
        const r = el.getBoundingClientRect();
        const box = {left:r.left-3,right:r.right+3,top:r.top-2,bottom:r.bottom+2};
        const overlaps = accepted.some(a => !(box.right <= a.left || box.left >= a.right || box.bottom <= a.top || box.top >= a.bottom));
        if (overlaps) {
          el.classList.add('xuan-label-overlap');
        } else if (r.width && r.height && r.right > mapRect.left && r.left < mapRect.right && r.bottom > mapRect.top && r.top < mapRect.bottom) {
          accepted.push(box);
        } else {
          el.classList.add('xuan-label-overlap');
        }
      });
    }));
  }
  weatherMap.on('zoomend moveend',syncStationLabelVisibility);
  window.addEventListener('resize',syncStationLabelVisibility);
  syncStationLabelVisibility();

  // 直接顯示每個測站，不進行群聚
stationMarkers = L.layerGroup();

  stationMarkers.addTo(weatherMap);

  setTimeout(() => weatherMap.invalidateSize(true),500);
}

/* 繪製測站 */

function drawMarkers() {
  if (!weatherMap || !stationMarkers) return;

  stationMarkers.clearLayers();

  // 氣溫圖層只顯示有正常氣溫讀值的測站；
  // 無氣溫資料、儀器故障或儀器調校的測站不顯示灰色圓點。
  // 雨量與風速圖層維持原本顯示邏輯，不受此條件影響。
  const valid = stations.filter(s =>
    s.lat !== null && s.lon !== null &&
    s.lat >= 20 && s.lat <= 27 &&
    s.lon >= 117 && s.lon <= 123 &&
    (
      mapMetric !== 'temperature' ||
      (
        s.temperature !== null &&
        !/儀器\s*(故障|調校)|故障|調校/.test(String(s.weather || ''))
      )
    )
  );

  const withValue = valid.filter(s => getMapValue(s) !== null);

  valid.forEach(station => {
    const value = getMapValue(station);
    const color = getColor(value);
    const selected = station.id === selectedId;
    const size = selected ? 17 : 11;

    
// 直接顯示單一測站圓點，不使用數字圖示或群聚圖示
    const marker = L.circleMarker(
      [station.lat, station.lon],
      {
        radius: selected ? 8 : 5,
        color: '#ffffff',
        weight: 1.5,
        opacity: 1,
        fillColor: color,
        fillOpacity: 0.95,
        interactive: true,
        bubblingMouseEvents: false
      }
    );

    const metricUnit = mapMetric === 'rain' ? 'mm' : (mapMetric === 'wind' ? 'm/s' : '°C');
    const metricValue = value === null ? '--' : `${fmt(value,1)} ${metricUnit}`;
    marker.bindTooltip(`
      <span class="xuan-station-label-name">${safe(station.name)}</span>
      <span class="xuan-station-label-value">${safe(metricValue)}</span>
    `, {
      permanent:true,
      direction:'bottom',
      offset:[0,7],
      opacity:1,
      className:'xuan-station-tooltip'
    });
    marker.on('tooltipopen', event => {
      if (event.tooltip && event.tooltip.getElement()) {
        event.tooltip.getElement().dataset.selected = selected ? '1' : '0';
      }
    });

    marker.bindPopup(`
      <div style="min-width:175px;line-height:1.8">
        <strong>${safe(station.name)}</strong>
        <div>${safe(station.county)} ${safe(station.town)}</div>
        <hr>
        氣溫：${fmt(station.temperature)} °C<br>
        天氣：${safe(station.weather)}<br>
        濕度：${fmt(station.humidity,0)} %<br>
        風速：${fmt(station.wind)} m/s<br>
        陣風：${fmt(station.gust)} m/s<br>
        雨量：${fmt(station.rain)} mm<br>
        <small>觀測時間：${safe(formatTime(station.time))}</small>
      </div>
    `);

    marker.addTo(stationMarkers);
  });

  const status = $('#map-status');

  if (status) {
    status.innerHTML = `
      <span>地圖範圍內有效座標：<b>${valid.length.toLocaleString('zh-TW')}</b> 站</span>
      <span>目前圖層有數值：<b>${withValue.length.toLocaleString('zh-TW')}</b> 站</span>
    `;
  }

  const totalEl = $('#stat-total');
  const coordinateEl = $('#stat-coordinate');
  const valuesEl = $('#stat-values');

  if (totalEl) totalEl.textContent = stations.length.toLocaleString('zh-TW');
  if (coordinateEl) coordinateEl.textContent = valid.length.toLocaleString('zh-TW');
  if (valuesEl) valuesEl.textContent = withValue.length.toLocaleString('zh-TW');

  if (gpsPosition && gpsMarker) {
    gpsMarker.setLatLng([gpsPosition.lat,gpsPosition.lon]);
  }
}

/* 距離計算與最近測站 */

function distanceKm(lat1,lon1,lat2,lon2) {
  const rad = value => value * Math.PI / 180;
  const dLat = rad(lat2-lat1);
  const dLon = rad(lon2-lon1);

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(rad(lat1)) *
    Math.cos(rad(lat2)) *
    Math.sin(dLon/2)**2;

  return 6371 * 2 * Math.atan2(
    Math.sqrt(a),Math.sqrt(1-a)
  );
}

function findNearest(lat,lon) {
  return stations
    .filter(s =>
      s.lat !== null && s.lon !== null &&
      s.temperature !== null
    )
    .map(s => ({
      ...s,
      distance:distanceKm(lat,lon,s.lat,s.lon)
    }))
    .sort((a,b) => a.distance-b.distance)[0] || null;
}

/* 更新所在地資訊 */

function updateLocal(station) {
  if (!station) return;

  selectedId = station.id;

  const label = $('#location-label');
  if (label) {
    label.textContent =
      `${station.county}・${station.town}・${station.name}`;
  }

  if ($('.temperature')) {
    $('.temperature').innerHTML =
      `${fmt(station.temperature)}<small>°C</small>`;
  }

  if ($('.condition')) {
    $('.condition').textContent =
      `${station.name}｜${station.weather}`;
  }

  if ($('.feels')) {
    $('.feels').textContent =
      `最近測站觀測｜${formatTime(station.time)}`;
  }

  const icon = $('.weather-icon');
  if (icon) {
    const weatherText = String(station.weather || '');
    icon.textContent = /雨|雷|陣雨|豪雨/.test(weatherText) ? '🌧️'
      : /陰|多雲/.test(weatherText) ? '⛅' : '🌤️';
  }

  const metrics = document.querySelectorAll('.metric strong');

  if (metrics[0]) metrics[0].innerHTML =
    `${fmt(station.humidity,0)}<em>%</em>`;

  if (metrics[1]) metrics[1].innerHTML =
    `${fmt(station.wind)}<em>m/s</em>`;

  if (metrics[2]) metrics[2].innerHTML =
    `${fmt(station.gust)}<em>m/s</em>`;

  if (metrics[3]) metrics[3].innerHTML =
    `${fmt(station.rain)}<em>mm</em>`;

  const status = $('#gps-status');
  if (status) {
    status.textContent =
      `定位成功｜最近測站：${station.name}｜直線距離 ${station.distance.toFixed(1)} 公里`;
    status.dataset.state = 'success';
  }

  drawMarkers();
}
/* iPhone GPS */

function locateUser() {
  if (locating) return;

  const button = $('#gps-button');
  const status = $('#gps-status');

  if (!navigator.geolocation) {
    status.textContent = '瀏覽器不支援 GPS 定位';
    status.dataset.state = 'error';
    return;
  }

  if (!window.isSecureContext) {
    status.textContent = 'GPS 定位需要 HTTPS 安全連線';
    status.dataset.state = 'error';
    return;
  }

  locating = true;
  button.disabled = true;
  button.textContent = '正在定位…';
  status.textContent = '請允許 Safari 使用你的位置';
  status.dataset.state = 'pending';

  navigator.geolocation.getCurrentPosition(
    position => {
      locating = false;
      button.disabled = false;
      button.textContent = '重新定位';

      gpsPosition = {
        lat:position.coords.latitude,
        lon:position.coords.longitude,
        accuracy:Math.max(1,position.coords.accuracy || 0)
      };

      const nearest = findNearest(
        gpsPosition.lat,gpsPosition.lon
      );

      if (!nearest) {
        status.textContent = '找不到具有有效座標及氣溫的測站';
        status.dataset.state = 'error';
        return;
      }

      updateLocal(nearest);

      if (weatherMap) {
        if (gpsMarker) weatherMap.removeLayer(gpsMarker);
        if (gpsAccuracyCircle) weatherMap.removeLayer(gpsAccuracyCircle);

        gpsAccuracyCircle = L.circle(
          [gpsPosition.lat,gpsPosition.lon],
          {
            radius:gpsPosition.accuracy,
            className:'xuan-gps-accuracy-breath',
            color:'#4285f4',
            weight:2,
            fillColor:'#4285f4',
            fillOpacity:.14,
            interactive:false
          }
        ).addTo(weatherMap);

        gpsMarker = L.marker(
          [gpsPosition.lat,gpsPosition.lon],
          {
            icon:L.divIcon({
              className:'xuan-gps-marker-wrap',
              html:'<div class="xuan-gps-marker"><span class="xuan-gps-pulse"></span><span class="xuan-gps-dot"></span></div>',
              iconSize:[28,28],
              iconAnchor:[14,14]
            }),
            zIndexOffset:10000
          }
        ).addTo(weatherMap)
          .bindPopup(`📍 你的 GPS 位置<br>定位精度：約 ${Math.round(gpsPosition.accuracy)} 公尺`)
          .openPopup();

        weatherMap.setView(
          [gpsPosition.lat,gpsPosition.lon],Math.max(weatherMap.getZoom(),9)
        );
      }
    },

    error => {
      locating = false;
      button.disabled = false;
      button.textContent = '重新定位';

      const messages = {
        1:'定位權限遭拒絕，請允許 Safari 使用位置',
        2:'無法取得 GPS 位置，請檢查定位服務',
        3:'定位逾時，請再次嘗試'
      };

      status.textContent =
        messages[error.code] || '定位失敗';
      status.dataset.state = 'error';
    },

    {
      enableHighAccuracy:true,
      timeout:25000,
      maximumAge:60000
    }
  );
}

/* 全臺測站列表 */

function renderStations() {
  const panel = $('#station-live-list');
  if (!panel) return;
  const keyword = ($('#station-search')?.value || '').trim().toLowerCase();
  const filtered = stations.filter(s =>
    `${s.name} ${s.county} ${s.town}`.toLowerCase().includes(keyword)
  );
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:11px;color:var(--muted)">
      <span>點擊測站可飛躍定位</span>
      <span>${filtered.length.toLocaleString('zh-TW')} 站</span>
    </div>
    <input id="station-search" type="search" placeholder="搜尋縣市、鄉鎮或測站名稱" value="${safe(keyword)}">
    <div class="xw-station-grid">
      ${filtered.slice(0, 120).map(s => `
        <button type="button" class="xw-station-card" data-lat="${s.lat ?? ''}" data-lon="${s.lon ?? ''}">
          <strong>${safe(s.name)}</strong>
          <small>${safe(s.county)} ${safe(s.town)}</small>
          <div class="temp">${fmt(s.temperature)}°C</div>
          <div class="meta">${safe(s.weather)}<br>濕度 ${fmt(s.humidity,0)}% · 風 ${fmt(s.wind)}m/s<br>雨量 ${fmt(s.rain)}mm</div>
        </button>
      `).join('')}
    </div>
  `;
  const input = $('#station-search');
  if (input) {
    input.addEventListener('input', () => {
      const pos = input.selectionStart;
      renderStations();
      const nextInput = $('#station-search');
      if (nextInput) {
        nextInput.focus();
        if (typeof pos === 'number') nextInput.setSelectionRange(pos, pos);
      }
    });
  }
  panel.querySelectorAll('.xw-station-card').forEach(card => {
    card.addEventListener('click', () => {
      const lat = Number(card.dataset.lat);
      const lon = Number(card.dataset.lon);
      if (weatherMap && Number.isFinite(lat) && Number.isFinite(lon)) {
        weatherMap.setView([lat, lon], Math.max(weatherMap.getZoom(), 11));
        $('#xw-drawer')?.classList.remove('open');
        $('#xw-drawer-toggle')?.setAttribute('aria-expanded', 'false');
      }
    });
  });
}

/* 首頁資料連線狀態：只改狀態顏色，不影響地圖或測站 */
function setDataConnectionStatus(state, message) {
  const element = $('.updated');
  if (!element) return;

  // 狀態由實際資料載入結果與資料時間決定，不強制假設已連線。
  element.dataset.state = ['connected', 'updating', 'error'].includes(state)
    ? state : 'updating';
  element.textContent = message;
  element.removeAttribute('style');
  element.setAttribute('role', 'status');
  element.setAttribute('aria-live', 'polite');
}


/* 全台即時極值摘要：僅使用本頁已取得的測站觀測值 */
function renderXuanHighlights() {
  const valid = stations.filter(s => s && s.name);
  const pick = key => valid.filter(s => Number.isFinite(s[key]))
    .sort((a,b) => b[key]-a[key]);
  const temp = pick('temperature');
  const gust = pick('gust');
  const rain = pick('rain');
  const low = temp.length ? [...temp].sort((a,b) => a.temperature-b.temperature)[0] : null;
  const set = (valueId, stationId, item, key, unit, digits=1) => {
    const valueEl = document.getElementById(valueId);
    const stationEl = document.getElementById(stationId);
    if (valueEl) valueEl.innerHTML = item ? `${Number(item[key]).toFixed(digits)}<em>${unit}</em>` : `--<em>${unit}</em>`;
    if (stationEl) stationEl.textContent = item ? `${item.county || ''} ${item.name}`.trim() : '目前無有效資料';
  };
  set('xuan-high-temp','xuan-high-temp-station',temp[0],'temperature','°C');
  set('xuan-low-temp','xuan-low-temp-station',low,'temperature','°C');
  set('xuan-max-gust','xuan-max-gust-station',gust[0],'gust','m/s');
  set('xuan-max-rain','xuan-max-rain-station',rain[0],'rain','mm');
}


/* Live rankings, regional comparison and observation briefing */
let currentRanking='hot';
const XUAN_REGIONS=[
  {name:'北部',counties:['臺北市','台北市','新北市','基隆市','桃園市','新竹市','新竹縣','宜蘭縣']},
  {name:'中部',counties:['苗栗縣','臺中市','台中市','彰化縣','南投縣','雲林縣']},
  {name:'南部',counties:['嘉義市','嘉義縣','臺南市','台南市','高雄市','屏東縣']},
  {name:'東部',counties:['花蓮縣','臺東縣','台東縣']},
  {name:'離島',counties:['澎湖縣','金門縣','連江縣']}
];
const XUAN_RANK_CONFIG={hot:{key:'temperature',unit:'°C',descending:true},cold:{key:'temperature',unit:'°C',descending:false},gust:{key:'gust',unit:'m/s',descending:true},rain:{key:'rain',unit:'mm',descending:true},wind:{key:'wind',unit:'m/s',descending:true}};
function renderLiveRankings(){
  const host=document.getElementById('xuan-ranking-list');if(!host)return;
  const cfg=XUAN_RANK_CONFIG[currentRanking]||XUAN_RANK_CONFIG.hot;
  const rows=stations.filter(x=>Number.isFinite(x[cfg.key])).sort((a,b)=>cfg.descending?b[cfg.key]-a[cfg.key]:a[cfg.key]-b[cfg.key]).slice(0,10);
  host.innerHTML=rows.length?rows.map((x,i)=>'<div class="xuan-rank-row"><span class="xuan-rank-number">'+(i+1)+'</span><div class="xuan-rank-station"><b>'+safe(x.name)+'</b><small>'+safe(x.county)+' '+safe(x.town)+'</small></div><span class="xuan-rank-value">'+fmt(x[cfg.key],1)+' '+cfg.unit+'</span></div>').join(''):'<div>目前沒有可用的有效觀測值</div>';
  document.querySelectorAll('[data-rank]').forEach(b=>{const active=b.dataset.rank===currentRanking;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
}
function renderRegionalComparison(){
  const host=document.getElementById('xuan-region-list');if(!host)return;
  const rows=XUAN_REGIONS.map(region=>{const members=stations.filter(x=>region.counties.includes(x.county)&&Number.isFinite(x.temperature));return {...region,count:members.length,average:members.length?members.reduce((a,x)=>a+x.temperature,0)/members.length:null};}).filter(x=>x.count);
  if(!rows.length){host.textContent='目前沒有足夠的區域氣溫資料';return;}
  const vals=rows.map(x=>x.average),min=Math.min(...vals),span=Math.max(1,Math.max(...vals)-min);
  host.innerHTML=rows.map(x=>'<div class="xuan-region-row"><span class="xuan-region-name">'+x.name+'</span><div class="xuan-region-track"><div class="xuan-region-fill" style="width:'+(18+(x.average-min)/span*82)+'%"></div></div><span class="xuan-region-value">'+x.average.toFixed(1)+'°C</span></div>').join('');
}
function renderWeatherBrief(){
  const host=document.getElementById('xuan-weather-brief');if(!host)return;
  const t=stations.filter(x=>Number.isFinite(x.temperature)),g=stations.filter(x=>Number.isFinite(x.gust)),r=stations.filter(x=>Number.isFinite(x.rain));
  const hot=[...t].sort((a,b)=>b.temperature-a.temperature)[0],cold=[...t].sort((a,b)=>a.temperature-b.temperature)[0],gust=[...g].sort((a,b)=>b.gust-a.gust)[0],rain=[...r].sort((a,b)=>b.rain-a.rain)[0];
  const items=[];if(hot)items.push(['🌡️','目前最高氣溫',hot.county+' '+hot.name+' '+fmt(hot.temperature)+'°C']);if(cold)items.push(['❄️','目前最低氣溫',cold.county+' '+cold.name+' '+fmt(cold.temperature)+'°C']);if(gust)items.push(['💨','目前最大陣風',gust.county+' '+gust.name+' '+fmt(gust.gust)+' m/s']);if(rain)items.push(['🌧️','目前最大瞬時雨量',rain.county+' '+rain.name+' '+fmt(rain.rain)+' mm']);
  host.innerHTML=items.map(([icon,label,value])=>'<div class="xuan-brief-item"><span>'+icon+'</span><div><strong>'+label+'</strong><br>'+safe(value)+'</div></div>').join('')||'目前沒有足夠資料產生觀測快報';
  const coverage=document.getElementById('xuan-data-coverage');if(coverage)coverage.textContent='資料概況：整合測站 '+stations.length+' 站｜氣溫有效 '+t.length+' 站｜陣風有效 '+g.length+' 站｜雨量有效 '+r.length+' 站';
}
function renderWeatherInsights(){renderLiveRankings();renderRegionalComparison();renderWeatherBrief();}
document.addEventListener('click',event=>{const button=event.target.closest('[data-rank]');if(!button)return;currentRanking=button.dataset.rank;renderLiveRankings();});

/* 讀取官方整合資料 */

async function loadWeatherData() {
  try {
    const response = await fetch(
      `${DATA_URL}?_=${Date.now()}`,
      {cache:'no-store'}
    );

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    if (
      !data.success ||
      !Array.isArray(data.stations) ||
      !data.stations.length
    ) {
      throw new Error('測站資料格式錯誤');
    }

    stations = data.stations.map(parseStation);
    const countBadge = $('#xw-station-count');
    if (countBadge) countBadge.textContent = stations.length.toLocaleString('zh-TW') + ' 站';
    renderXuanHighlights();
    renderWeatherInsights();

    const validTemperature = stations.filter(
      s => s.temperature !== null
    );

    const updatedTimestamp = Date.parse(data.updatedAt);
    const ageMs = Date.now() - updatedTimestamp;
    const isRecent = Number.isFinite(updatedTimestamp) &&
      ageMs >= -5 * 60 * 1000 && ageMs <= 20 * 60 * 1000;

    setDataConnectionStatus(
      isRecent ? 'connected' : 'updating',
      isRecent
        ? `即時資料已連線｜${formatTime(data.updatedAt)}`
        : `資料已載入，等待最新同步｜${formatTime(data.updatedAt)}`
    );

    if (selectedId) {
      const selected = stations.find(s => s.id === selectedId);

      if (selected) {
        selected.distance = gpsPosition
          ? distanceKm(
              gpsPosition.lat,gpsPosition.lon,
              selected.lat,selected.lon
            )
          : 0;

        updateLocal(selected);
      }
    } else {
      $('.temperature').innerHTML =
        `${fmt(average('temperature'))}<small>°C</small>`;

      $('.condition').textContent =
        `全臺測站平均氣溫｜${validTemperature.length} 個有效測站`;

      $('.feels').textContent =
        '全臺平均統計｜非所在地觀測';

      const metrics = document.querySelectorAll('.metric strong');

      if (metrics[0]) metrics[0].innerHTML =
        `${fmt(average('humidity'))}<em>%</em>`;

      if (metrics[1]) metrics[1].innerHTML =
        `${fmt(average('wind'))}<em>m/s</em>`;

      if (metrics[2]) metrics[2].innerHTML =
        `${fmt(maximum('gust'))}<em>m/s</em>`;

      if (metrics[3]) metrics[3].innerHTML =
        `${fmt(maximum('rain'))}<em>mm</em>`;
    }

    renderStations();
    drawMarkers();

    console.log(
      `Xuan Weather：成功載入 ${stations.length} 個整合測站`
    );

  } catch (error) {
    console.error('氣象資料讀取失敗：',error);

    setDataConnectionStatus('error', '即時資料讀取失敗，請稍後重試');

    const status = $('#map-status');
    if (status) status.textContent = '測站資料讀取失敗，請稍後重新整理';
  }
}

/* 啟動 */

async function startWeather() {
  setDataConnectionStatus('updating', '正在連線');
  setupLocation();
  setupMap();
  await loadWeatherData();

  try {
    await loadLeaflet();
    initMap();
    drawMarkers();

    setTimeout(() => {
      if (weatherMap) weatherMap.invalidateSize(true);
    },700);

  } catch (error) {
    console.error('地圖載入失敗：',error);

    const status = $('#map-status');
    if (status) {
      status.textContent =
        '地圖載入失敗，請檢查網路連線或稍後重試';
    }
  }

  setInterval(loadWeatherData,REFRESH_MS);
}

startWeather();



document.getElementById('toggle-local-card')?.addEventListener('click', () => {
  const card = document.getElementById('xw-local-card');
  if (!card) return;
  const hidden = card.style.display === 'none';
  card.style.display = hidden ? '' : 'none';
});
document.getElementById('xw-drawer-toggle')?.addEventListener('click', () => {
  const drawer = document.getElementById('xw-drawer');
  const btn = document.getElementById('xw-drawer-toggle');
  if (!drawer || !btn) return;
  const open = drawer.classList.toggle('open');
  btn.setAttribute('aria-expanded', String(open));
  if (weatherMap) setTimeout(() => weatherMap.invalidateSize(true), 120);
});
document.querySelectorAll('.xw-drawer-tabs [data-tab]').forEach(tabBtn => {
  tabBtn.addEventListener('click', () => {
    const target = tabBtn.dataset.tab;
    document.querySelectorAll('.xw-drawer-tabs [data-tab]').forEach(b => b.classList.toggle('active', b === tabBtn));
    document.querySelectorAll('.xw-tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + target));
  });
});
document.getElementById('refresh-weather')?.addEventListener('click', async () => {
  const btn = document.getElementById('refresh-weather');
  if (!btn || typeof loadWeatherData !== 'function') return;
  btn.disabled = true;
  try { await loadWeatherData(); } finally { btn.disabled = false; }
});

</script>
