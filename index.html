<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Weather Now｜即時天氣</title>
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#152033;--muted:#718096;--line:#e4eaf1;--accent:#2878ff;--shadow:0 12px 35px rgba(28,48,80,.09)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Arial,sans-serif;background:linear-gradient(180deg,#101827 0 285px,var(--bg) 285px);color:var(--ink)}
button,select{font:inherit}.wrap{max-width:1050px;margin:auto;padding:22px 18px 45px}.top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:22px}
.brand{font-size:22px;font-weight:800}.brand small{display:block;font-size:12px;font-weight:500;opacity:.65;margin-top:3px}.actions{display:flex;gap:9px}.iconbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;border-radius:14px;width:42px;height:42px;cursor:pointer}
.hero{background:linear-gradient(135deg,#1e2d48,#172235);color:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-90px;top:-100px;background:radial-gradient(circle,rgba(104,159,255,.35),transparent 67%)}
.search{display:flex;gap:10px;position:relative;z-index:2}.search select{flex:1;background:#fff;border:0;border-radius:14px;padding:13px 14px;color:#18243a;outline:none}.loc{border:0;border-radius:14px;padding:0 15px;background:#2d7cff;color:#fff;cursor:pointer}
.place{margin-top:26px;font-size:15px;opacity:.78}.temp{font-size:72px;line-height:1;font-weight:800;letter-spacing:-3px;margin:5px 0}.desc{font-size:20px;font-weight:650}.updated{font-size:12px;opacity:.58;margin-top:7px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:23px}.metric{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:17px;padding:13px}.metric b{display:block;font-size:17px;margin-top:5px}.metric span{font-size:11px;opacity:.6}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 7px 25px rgba(28,48,80,.045)}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.title h2{font-size:17px;margin:0}.title span{font-size:12px;color:var(--muted)}
.hourly{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px}.hour{min-width:74px;text-align:center;background:#f7f9fc;border:1px solid #edf1f6;border-radius:17px;padding:12px 8px}.hour .time{font-size:12px;color:var(--muted)}.hour .ico{font-size:26px;margin:8px 0}.hour b{font-size:15px}.rain{font-size:11px;color:#2878ff;margin-top:5px}
.days{display:flex;flex-direction:column;gap:7px}.day{display:grid;grid-template-columns:72px 45px 1fr auto;align-items:center;gap:8px;padding:11px 7px;border-bottom:1px solid var(--line)}.day:last-child{border:0}.dayname{font-weight:650}.day .ico{text-align:center;font-size:23px}.range{text-align:right;font-weight:650}.range span{color:#a0a9b7;font-weight:500;margin-left:7px}.dayrain{font-size:11px;color:#2878ff}
.sun{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sunbox{background:#f7f9fc;border-radius:18px;padding:15px}.sunbox b{display:block;margin-top:5px;font-size:18px}.sunbox span{font-size:12px;color:var(--muted)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.infoitem{padding:14px;background:#f7f9fc;border-radius:17px}.infoitem span{font-size:11px;color:var(--muted)}.infoitem b{display:block;margin-top:5px;font-size:16px}
.footer{text-align:center;color:#8a95a5;font-size:11px;margin-top:20px}.loading{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:760px){body{background:linear-gradient(180deg,#101827 0 310px,var(--bg) 310px)}.wrap{padding:17px 13px 35px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.temp{font-size:64px}.hero{border-radius:23px}.card{border-radius:21px;padding:17px}.day{grid-template-columns:58px 38px 1fr auto}.search select{min-width:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">🌤️ Weather Now<small>簡潔、快速的台灣天氣</small></div><button class="iconbtn" id="themeBtn">☾</button></header>
<section class="hero">
<div class="search"><select id="city"></select><button class="loc" id="locBtn">📍 定位</button></div>
<div class="place" id="place">載入中…</div><div class="temp" id="temp">--°</div><div class="desc" id="desc">正在取得天氣</div><div class="updated" id="updated">資料來源：Open-Meteo</div>
<div class="metrics"><div class="metric">💧<span>濕度</span><b id="humidity">--%</b></div><div class="metric">💨<span>風速</span><b id="wind">-- km/h</b></div><div class="metric">🌧️<span>降雨機率</span><b id="pop">--%</b></div><div class="metric">☀️<span>紫外線</span><b id="uv">--</b></div></div>
</section>
<div class="grid">
<section class="card"><div class="title"><h2>未來 24 小時</h2><span>每 3 小時</span></div><div class="hourly" id="hourly"><div class="loading">載入中…</div></div></section>
<section class="card"><div class="title"><h2>日出與日落</h2><span>當地時間</span></div><div class="sun"><div class="sunbox">🌅<span>日出</span><b id="sunrise">--:--</b></div><div class="sunbox">🌇<span>日落</span><b id="sunset">--:--</b></div></div>
<div class="title" style="margin-top:18px"><h2>目前狀態</h2></div><div class="info"><div class="infoitem"><span>體感溫度</span><b id="feels">--°</b></div><div class="infoitem"><span>氣壓</span><b id="pressure">-- hPa</b></div></div></section>
</div>
<section class="card" style="margin-top:16px"><div class="title"><h2>未來 7 天</h2><span>每日預報</span></div><div class="days" id="days"><div class="loading">載入中…</div></div></section>
<div class="footer">Weather Now · 資料由 Open-Meteo 提供 · 無需 API Key</div>
</div>
<script>
const cities={"台北市":[25.0375,121.5637],"新北市":[25.0117,121.4618],"桃園市":[24.9937,121.301],"新竹市":[24.8138,120.9675],"台中市":[24.1477,120.6736],"彰化縣":[24.0518,120.5161],"南投縣":[23.9609,120.9719],"雲林縣":[23.7092,120.4313],"嘉義市":[23.4801,120.4491],"台南市":[22.9997,120.227],"高雄市":[22.6273,120.3014],"屏東縣":[22.5519,120.5487],"宜蘭縣":[24.7021,121.7378],"花蓮縣":[23.9911,121.6112],"台東縣":[22.7554,121.15],"澎湖縣":[23.5711,119.5793],"金門縣":[24.4493,118.3767],"連江縣":[26.1605,119.951]};
const weather={0:["☀️","晴"],1:["🌤️","大致晴"],2:["⛅","部分多雲"],3:["☁️","多雲"],45:["🌫️","霧"],48:["🌫️","霧凇"],51:["🌦️","毛毛雨"],53:["🌦️","毛毛雨"],55:["🌧️","毛毛雨"],61:["🌦️","小雨"],63:["🌧️","中雨"],65:["🌧️","大雨"],71:["🌨️","小雪"],73:["🌨️","中雪"],75:["❄️","大雪"],80:["🌦️","陣雨"],81:["🌧️","陣雨"],82:["⛈️","強陣雨"],95:["⛈️","雷雨"],96:["⛈️","雷雨伴冰雹"],99:["⛈️","強雷雨"]};
const city=document.getElementById("city");Object.keys(cities).forEach(n=>city.add(new Option(n,n)));city.value="高雄市";
function time(s){return s?.slice(11,16)||"--:--"}function desc(c){return weather[c]||["🌡️","天氣"]}
function render(d,name){const c=d.current,u=d.hourly,day=d.daily;document.getElementById("place").textContent="📍 "+name;document.getElementById("temp").textContent=Math.round(c.temperature_2m)+"°";document.getElementById("desc").textContent=desc(c.weather_code)[0]+" "+desc(c.weather_code)[1];document.getElementById("humidity").textContent=c.relative_humidity_2m+"%";document.getElementById("wind").textContent=Math.round(c.wind_speed_10m)+" km/h";document.getElementById("pop").textContent=(u.precipitation_probability[0]??0)+"%";document.getElementById("uv").textContent=(day.uv_index_max[0]??0).toFixed(1);document.getElementById("feels").textContent=Math.round(c.apparent_temperature)+"°";document.getElementById("pressure").textContent=Math.round(c.surface_pressure)+" hPa";document.getElementById("sunrise").textContent=time(day.sunrise[0]);document.getElementById("sunset").textContent=time(day.sunset[0]);document.getElementById("updated").textContent="更新時間 "+time(c.time)+" · 資料來源：Open-Meteo";
const h=document.getElementById("hourly");h.innerHTML="";const start=Math.max(0,u.time.findIndex(x=>x>=c.time));for(let i=start;i<Math.min(start+24,u.time.length);i+=3){const x=document.createElement("div");x.className="hour";x.innerHTML="<div class='time'>"+time(u.time[i])+"</div><div class='ico'>"+desc(u.weather_code[i])[0]+"</div><b>"+Math.round(u.temperature_2m[i])+"°</b><div class='rain'>💧"+(u.precipitation_probability[i]??0)+"%</div>";h.appendChild(x)}
const days=document.getElementById("days");days.innerHTML="";const names=["週日","週一","週二","週三","週四","週五","週六"];for(let i=0;i<7;i++){const dt=new Date(day.time[i]+"T12:00:00"),x=document.createElement("div");x.className="day";x.innerHTML="<div class='dayname'>"+(i===0?"今天":names[dt.getDay()])+"</div><div class='ico'>"+desc(day.weather_code[i])[0]+"</div><div><div>"+desc(day.weather_code[i])[1]+"</div><div class='dayrain'>💧 "+(day.precipitation_probability_max[i]??0)+"%</div></div><div class='range'>"+Math.round(day.temperature_2m_max[i])+"° <span>"+Math.round(day.temperature_2m_min[i])+"°</span></div>";days.appendChild(x)}}
async function load(lat,lon,name){document.getElementById("place").textContent="📍 "+name+" · 載入中";try{const p=new URLSearchParams({latitude:lat,longitude:lon,timezone:"Asia/Taipei",current:"temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m",hourly:"temperature_2m,precipitation_probability,weather_code",daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset",forecast_days:"7"});const r=await fetch("https://api.open-meteo.com/v1/forecast?"+p);if(!r.ok)throw Error("天氣服務暫時無法連線");render(await r.json(),name)}catch(e){document.getElementById("desc").textContent="⚠️ "+e.message}}
city.onchange=()=>{const [lat,lon]=cities[city.value];load(lat,lon,city.value)};
document.getElementById("locBtn").onclick=()=>{if(!navigator.geolocation)return alert("此裝置不支援定位");navigator.geolocation.getCurrentPosition(p=>{city.value="";load(p.coords.latitude,p.coords.longitude,"目前位置")},()=>alert("無法取得位置，請改用城市選擇"))};
document.getElementById("themeBtn").onclick=()=>{document.body.classList.toggle("dark");const d=document.body.classList.contains("dark");document.documentElement.style.setProperty("--bg",d?"#0d1421":"#eef3f8");document.documentElement.style.setProperty("--card",d?"#151e2d":"#fff");document.documentElement.style.setProperty("--ink",d?"#f3f6fb":"#152033");document.documentElement.style.setProperty("--line",d?"#263246":"#e4eaf1");document.getElementById("themeBtn").textContent=d?"☀":"☾"};
const [lat,lon]=cities["高雄市"];load(lat,lon,"高雄市");
</script>
</body>
</html>
