```html
<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>全台天氣 API 測試</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #eaf6ff;
    padding: 20px;
}

.box {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #1683e8;
    color: white;
    font-size: 18px;
}

#result {
    margin-top: 20px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
}

</style>

</head>

<body>

<div class="box">

<h1>🇹🇼 全台天氣測試</h1>

<button onclick="getWeather()">
測試中央氣象署
</button>

<div id="result">
尚未測試
</div>

</div>


<script>

/*
====================================
你的中央氣象署授權碼
====================================
*/

const API_KEY = "CWA-8BC01589-C3CD-4A80-9A3B-1AFA46E9F246";


/*
====================================
全台 368 鄉鎮市區
====================================
*/

const API_URL =
"https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-D0047-093"
+
"?Authorization="
+
encodeURIComponent(API_KEY)
+
"&format=JSON";


async function getWeather() {

    const result =
    document.getElementById("result");

    result.innerText =
    "⏳ 正在連接中央氣象署...\n";


    try {

        const response =
        await fetch(API_URL);


        /*
        先顯示 HTTP 狀態
        */

        result.innerText =
        "HTTP 狀態："
        +
        response.status
        +
        "\n正在讀取資料...";


        const data =
        await response.json();


        console.log(data);


        /*
        API 是否成功
        */

        if (
            data.success !== "true"
        ) {

            result.innerText =
            "❌ API 回傳失敗\n\n"
            +
            JSON.stringify(
                data,
                null,
                2
            );

            return;

        }


        /*
        全台行政區
        */

        const locations =
        data.records
        .Locations[0]
        .Location;


        /*
        顯示結果
        */

        let text =
        "✅ 成功連接中央氣象署！\n\n";


        text +=
        "全台資料筆數："
        +
        locations.length
        +
        "\n\n";


        /*
        顯示第一個行政區
        */

        const area =
        locations[0];


        text +=
        "第一個行政區："
        +
        area.LocationName
        +
        "\n\n";


        /*
        顯示有哪些氣象欄位
        */

        text +=
        "氣象資料欄位：\n";


        area.WeatherElement.forEach(
            function(element) {

                text +=
                "• "
                +
                element.ElementName
                +
                "\n";

            }
        );


        /*
        顯示第一筆完整資料
        */

        text +=
        "\n===== 第一個行政區資料 =====\n\n";


        text +=
        JSON.stringify(
            area.WeatherElement,
            null,
            2
        );


        result.innerText =
        text;

    }


    catch(error) {

        console.log(error);


        result.innerText =
        "❌ 連線錯誤\n\n"
        +
        error.message
        +
        "\n\n"
        +
        "如果這裡仍然顯示連線錯誤，"
        +
        "就代表 Kodex 預覽環境無法直接連中央氣象署 API。";

    }

}

</script>

</body>

</html>
```
