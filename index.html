<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣即時氣象觀測與預報中心 | Xuan Weather</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 全螢幕沉浸式基礎設定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #060a12;
            user-select: none;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #080d17;
        }

        /* 動態風場流線 Canvas 疊加層 (不阻擋地圖滑鼠互動) */
        #wind-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 450; /* 位於底圖上方，測站標記之下 */
            pointer-events: none;
        }

        /* 隱藏預設 Leaflet 縮放控制項 */
        .leaflet-control-zoom {
            display: none !important;
        }
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.7) !important;
            color: #64748b !important;
            backdrop-filter: blur(6px);
            font-size: 10px !important;
            border-top-left-radius: 8px;
        }
        .leaflet-control-attribution a {
            color: #94a3b8 !important;
        }

        /* 毛玻璃面板通用樣式 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.22);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.65), 0 8px 10px -6px rgba(0, 0, 0, 0.65);
        }

        /* 氣象警特報多邊形呼吸閃爍動畫 */
        @keyframes alertPulse {
            0%, 100% { fill-opacity: 0.16; stroke-opacity: 0.85; }
            50% { fill-opacity: 0.34; stroke-opacity: 1; }
        }
        .alert-polygon-pulse {
            animation: alertPulse 2.6s ease-in-out infinite;
        }/* 測站氣溫膠囊發光與懸停動畫 */
        .station-pill {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }
        .station-pill:hover {
            transform: scale(1.12) translateY(-2px);
            z-index: 1000 !important;
        }
        .station-pill-active {
            transform: scale(1.15);
            box-shadow: 0 0 0 2px #ffffff, 0 0 18px rgba(56, 189, 248, 0.95) !important;
        }

        /* 自訂 Leaflet 彈出氣泡框 */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            border: 1px solid rgba(56, 189, 248, 0.35) !important;
            color: #f8fafc !important;
            border-radius: 16px !important;
            box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.75) !important;
            padding: 0 !important;
        }
        .leaflet-popup-content {
            margin: 0 !important;
            min-width: 270px;
            max-width: 310px;
        }
        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.9) !important;
            border: 1px solid rgba(56, 189, 248, 0.35) !important;
        }
        .leaflet-popup-close-button {
            color: #94a3b8 !important;
            top: 10px !important;
            right: 10px !important;
            font-size: 18px !important;
        }
        .leaflet-popup-close-button:hover {
            color: #ffffff !important;
        }

        /* 跑馬燈動畫 */
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-flex;
            white-space: nowrap;
            animation: marquee 28s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }

        /* 自訂深色細捲軸 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.25);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.35);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.65);
        }</style>
</head>
<body class="text-slate-100 font-sans antialiased">

    <!-- 全螢幕深色地圖容器 -->
    <div id="map"></div>

    <!-- 風場流線示意（非實測） Canvas 疊加層 -->
    <canvas id="wind-canvas"></canvas>

    <!-- ==================== 1. 頂部懸浮狀態列 ==================== -->
    <header class="fixed top-3 left-3 right-3 z-30 pointer-events-none flex flex-col xl:flex-row items-stretch xl:items-center justify-between gap-2.5">
        
        <!-- 左側：系統標題與即時更新時間 -->
        <div class="pointer-events-auto glass-panel rounded-2xl px-4 py-2.5 flex items-center justify-between gap-4 shrink-0">
            <div class="flex items-center gap-3">
                <div class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-sky-500/15 border border-sky-400/40 text-sky-400">
                    <i data-lucide="cloud-sun" class="w-5 h-5"></i>
                    <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-sky-500"></span>
                    </span>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-sm sm:text-base font-bold tracking-wide text-white">台灣即時氣象觀測中心</h1>
                        <span class="hidden sm:inline-block text-[10px] font-mono px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-400/30">CWA LIVE</span>
                    </div>
                    <p class="text-[11px] text-slate-400 flex items-center gap-2">
                        <span id="scenario-status-text" class="text-emerald-400 font-medium">● CWA 即時觀測資料</span>
                        <span>|</span>
                        <span>資料更新時間：<strong id="obs-clock" class="text-slate-200 font-mono">--:--:--</strong></span>
                    </p>
                </div>
            </div>

            <!-- 手機/平板快速切換面板按鈕 -->
            <div class="flex lg:hidden items-center gap-1.5">
                <button onclick="toggleLeftPanel()" title="圖層與情境控制" class="w-9 h-9 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-600/50 flex items-center justify-center text-sky-300 transition">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                </button>
                <button onclick="toggleRightDrawer()" title="測站詳情與預報" class="w-9 h-9 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-600/50 flex items-center justify-center text-amber-300 transition">
                    <i data-lucide="cloud-sun" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- 中間：全台天氣警特報跑馬燈提示 -->
        <div class="pointer-events-auto glass-panel rounded-2xl px-3.5 py-2 flex items-center gap-2.5 overflow-hidden flex-1 max-w-full xl:max-w-xl">
            <span class="shrink-0 px-2 py-0.5 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-300 text-[11px] font-bold flex items-center gap-1">
                <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> 警特報
            </span>
            <div class="overflow-hidden relative flex-1 text-xs text-slate-200">
                <div id="alert-marquee" class="animate-marquee gap-8">
                    <!-- 由 JS 依據情境動態填入警特報跑馬燈內容 -->
                </div>
            </div>
        </div>

        <!-- 右側：手動刷新與 CWA Open Data API 說明按鈕 -->
        <div class="pointer-events-auto glass-panel rounded-2xl px-3 py-2 flex items-center justify-between xl:justify-end gap-2 shrink-0">
            <button onclick="manualRefreshData()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-600/50 text-slate-200 text-xs font-medium transition cursor-pointer">
                <i id="refresh-spin-icon" data-lucide="refresh-cw" class="w-3.5 h-3.5 text-sky-400"></i>
                <span>更新觀測</span>
            </button>

            <button onclick="openApiModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-600/90 hover:bg-sky-500 text-white text-xs font-semibold shadow-lg shadow-sky-950/60 transition cursor-pointer">
                <i data-lucide="database" class="w-3.5 h-3.5"></i>
                <span>中央氣象署資料來源與串接狀態</span>
            </button>
        </div>
    </header>

    <!-- ==================== 2. 左側懸浮圖層與區域控制台 (可一鍵收合/展開) ==================== -->
    <aside id="left-panel" class="fixed top-36 xl:top-20 left-3 z-20 w-72 max-w-[calc(100vw-1.5rem)] transition-all duration-300 transform translate-x-0">
        <div class="glass-panel rounded-2xl overflow-hidden">
            
            <!-- 標題與收合按鈕 -->
            <div class="px-4 py-2.5 border-b border-slate-700/60 flex items-center justify-between bg-slate-800/40">
                <div class="flex items-center gap-2 text-xs font-bold text-sky-300 tracking-wider">
                    <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                    <span>氣象圖層與情境控制台</span>
                </div>
                <button onclick="toggleLeftPanel()" title="收合控制台" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-700/50 transition cursor-pointer">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="p-3.5 space-y-4 max-h-[calc(100vh-15.5rem)] overflow-y-auto custom-scrollbar">
                
                <!-- 即時資料來源狀態 -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-2">即時資料來源</label>
                    <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 p-3 text-xs leading-relaxed">
                        <div class="flex items-center gap-2 text-emerald-300 font-bold mb-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>中央氣象署觀測資料</div>
                        <p class="text-slate-400">測站觀測與鄉鎮預報取自中央氣象署；AQI 與紫外線取自環境部。</p>
                    </div>
                </div>

                <!-- 2. 氣象圖層開關 (5 大圖層) -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-2">動態氣象圖層開關</label>
                    <div class="space-y-1.5">
<!-- 動態風場流線 -->
                        <label class="flex items-center justify-between p-2 rounded-xl bg-slate-800/50 hover:bg-slate-800/80 border border-slate-700/40 cursor-pointer transition">
                            <span class="flex items-center gap-2 text-xs font-medium text-slate-200">
                                <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_6px_#22d3ee]"></span>
                                動態風場流線粒子
                            </span>
                            <input type="checkbox" onchange="toggleWeatherLayer('wind', this.checked)" class="sr-only peer">
                            <div class="w-8 h-4.5 bg-slate-700 rounded-full peer peer-checked:bg-sky-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:after:translate-x-3.5"></div>
                        </label>

                        <!-- 測站氣溫標籤 -->
                        <label class="flex items-center justify-between p-2 rounded-xl bg-slate-800/50 hover:bg-slate-800/80 border border-slate-700/40 cursor-pointer transition">
                            <span class="flex items-center gap-2 text-xs font-medium text-slate-200">
                                <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_6px_#fbbf24]"></span>
                                測站氣溫膠囊標籤
                            </span>
                            <input type="checkbox" checked onchange="toggleWeatherLayer('stations', this.checked)" class="sr-only peer">
                            <div class="w-8 h-4.5 bg-slate-700 rounded-full peer peer-checked:bg-sky-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:after:translate-x-3.5"></div>
                        </label>

                        <!-- 氣象警特報範圍 -->
                        <label class="flex items-center justify-between p-2 rounded-xl bg-slate-800/50 hover:bg-slate-800/80 border border-slate-700/40 cursor-pointer transition">
                            <span class="flex items-center gap-2 text-xs font-medium text-slate-200">
                                <span class="w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_6px_#f43f5e]"></span>
                                氣象警特報範圍（尚未串接）
                            </span>
                            <input type="checkbox" checked onchange="toggleWeatherLayer('alerts', this.checked)" class="sr-only peer">
                            <div class="w-8 h-4.5 bg-slate-700 rounded-full peer peer-checked:bg-sky-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:after:translate-x-3.5"></div>
                        </label>

                        <!-- 衛星雲圖紅外線遮罩 -->
                        <label class="flex items-center justify-between p-2 rounded-xl bg-slate-800/50 hover:bg-slate-800/80 border border-slate-700/40 cursor-pointer transition">
                            <span class="flex items-center gap-2 text-xs font-medium text-slate-200">
                                <span class="w-2 h-2 rounded-full bg-indigo-400 shadow-[0_0_6px_#818cf8]"></span>
                                衛星雲圖（不啟用）
                            </span>
                            <input type="checkbox" disabled onchange="toggleWeatherLayer('satellite', this.checked)" class="sr-only peer">
                            <div class="w-8 h-4.5 bg-slate-700 rounded-full peer peer-checked:bg-sky-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:after:translate-x-3.5"></div>
                        </label>
                    </div>
                </div>

                <!-- 3. 區域快速飛越按鈕 -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-2">區域視角快速飛越</label>
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="flyToRegion('taiwan', this)" class="region-btn col-span-3 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-sky-500/20 text-sky-300 border border-sky-400/50 transition cursor-pointer">
                            全台灣本島總覽
                        </button>
                        <button onclick="flyToRegion('north', this)" class="region-btn px-2 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition cursor-pointer">
                            北部地區
                        </button>
                        <button onclick="flyToRegion('central', this)" class="region-btn px-2 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition cursor-pointer">
                            中部地區
                        </button>
                        <button onclick="flyToRegion('south', this)" class="region-btn px-2 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition cursor-pointer">
                            南部 (高雄)
                        </button>
                        <button onclick="flyToRegion('east', this)" class="region-btn col-span-3 px-2.5 py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition cursor-pointer">
                            東部與花東縱谷
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </aside>

    <!-- 左側收合時的展開浮動按鈕 -->
    <button id="left-panel-expand-btn" onclick="toggleLeftPanel()" class="hidden fixed top-36 xl:top-20 left-3 z-20 glass-panel hover:bg-slate-800/90 text-sky-300 px-3 py-2.5 rounded-2xl items-center gap-2 text-xs font-semibold transition cursor-pointer">
        <i data-lucide="layers" class="w-4 h-4"></i>
        <span>圖層控制</span>
    </button>

    <!-- ==================== 3. 右側懸浮即時天氣詳情與預報抽屜 (可一鍵收合/展開) ==================== -->
    <aside id="right-drawer" class="fixed top-36 xl:top-20 right-3 z-20 w-84 sm:w-96 max-w-[calc(100vw-1.5rem)] transition-all duration-300 transform translate-x-0">
        <div class="glass-panel rounded-2xl overflow-hidden flex flex-col max-h-[calc(100vh-14.5rem)]">
            
            <!-- 抽屜標題列 -->
            <div class="px-4 py-2.5 border-b border-slate-700/60 bg-slate-800/40 flex items-center justify-between">
                <div class="flex items-center gap-2 text-xs font-bold text-amber-300 tracking-wider">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-400"></i>
                    <span>測站即時觀測</span><span id="station-count-label" class="text-[10px] text-emerald-300">載入中</span>
                </div>
                <button onclick="toggleRightDrawer()" title="收合天氣面板" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-700/50 transition cursor-pointer">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- 抽屜可捲動主內容區 -->
            <div class="p-4 space-y-4 overflow-y-auto custom-scrollbar">
                
                <!-- 當前選定測站大字體主卡片 (預設高雄市三民區) -->
                <div class="p-3.5 rounded-2xl bg-gradient-to-br from-slate-800/90 via-slate-900/90 to-sky-950/60 border border-sky-500/30 relative overflow-hidden">
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span id="detail-station-name" class="text-base font-bold text-white">高雄市三民區</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-400/30">即時測站</span>
                            </div>
                            <p id="detail-weather-desc" class="text-xs text-slate-300 mt-0.5">多雲時晴 • 能見度良好</p>
                        </div>
                        <div id="detail-weather-icon" class="w-11 h-11 rounded-2xl bg-sky-500/15 border border-sky-400/30 flex items-center justify-center text-amber-300">
                            <!-- 內嵌 SVG 天氣圖示 -->
                        </div>
                    </div>

                    <div class="mt-3 flex items-baseline justify-between">
                        <div class="flex items-baseline gap-1">
                            <span id="detail-temp" class="text-4xl font-bold font-mono tracking-tight text-white">24.8</span>
                            <span class="text-lg font-medium text-sky-300">°C</span>
                        </div>
                        <div class="text-right text-xs text-slate-300 space-y-0.5">
                            <div>體感溫度 <strong id="detail-feels-like" class="text-white font-mono">未提供</strong></div>
                            <div>AQI <span id="detail-aqi" class="px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 font-mono font-bold">載入中</span></div><div id="detail-aqi-source" class="text-[9px] text-slate-500 mt-1">最近環境部測站</div>
                        </div>
                    </div>

                    <!-- 四項核心氣象指標 -->
                    <div class="mt-3.5 pt-3 border-t border-slate-700/60 grid grid-cols-4 gap-1.5 text-center">
                        <div class="bg-slate-950/50 rounded-xl p-1.5">
                            <div class="text-[10px] text-slate-400">相對濕度</div>
                            <div id="detail-humidity" class="text-xs font-mono font-bold text-sky-300 mt-0.5">68%</div>
                        </div>
                        <div class="bg-slate-950/50 rounded-xl p-1.5">
                            <div class="text-[10px] text-slate-400">風向風速</div>
                            <div id="detail-wind" class="text-xs font-mono font-bold text-emerald-300 mt-0.5">東北 3.2m/s</div>
                        </div>
                        <div class="bg-slate-950/50 rounded-xl p-1.5">
                            <div class="text-[10px] text-slate-400">累積雨量</div>
                            <div id="detail-rain" class="text-xs font-mono font-bold text-cyan-300 mt-0.5">0.0 mm</div>
                        </div>
                        <div class="bg-slate-950/50 rounded-xl p-1.5">
                            <div class="text-[10px] text-slate-400">紫外線</div>

    <!-- 右側收合時的展開浮動按鈕 -->
    <button id="right-drawer-expand-btn" onclick="toggleRightDrawer()" class="hidden fixed top-36 xl:top-20 right-3 z-20 glass-panel hover:bg-slate-800/90 text-amber-300 px-3 py-2.5 rounded-2xl items-center gap-2 text-xs font-semibold transition cursor-pointer">

    <!-- 系統狀態提示 Toast -->

    <!-- ==================== JavaScript 核心氣象視覺化引擎 ==================== -->
    <script>
        // 初始化 Lucide 圖示
        lucide.createIcons();

        // 1. 初始化全螢幕 Leaflet 地圖 (預設聚焦台灣本島，略偏高雄三民區視角)
        const map = L.map('map', {
            center: [23.55, 120.85],
            zoom: 8,
            zoomControl: false,
            attributionControl: true
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO | 中央氣象署測站觀測與鄉鎮預報',
            subdomains: 'abcd',
            maxZoom: 18,
            minZoom: 6
        }).addTo(map);

        // 僅保留測站與警特報圖層；不載入雷達或衛星影像
        const weatherLayers = { stations: L.layerGroup().addTo(map), alerts: L.layerGroup() };

        // 區域飛越座標預設
        const regionPresets = {
            taiwan: { center: [23.55, 120.85], zoom: 8, label: '全台灣本島總覽' },
            north: { center: [25.02, 121.52], zoom: 10, label: '北部地區 (雙北/桃竹)' },
            central: { center: [24.15, 120.68], zoom: 10, label: '中部地區 (台中/彰化)' },
            south: { center: [22.66, 120.32], zoom: 11, label: '南部地區 (高雄市三民區核心)' },
            east: { center: [23.85, 121.48], zoom: 9, label: '東部與花東縱谷' }
        };

        // 全局狀態：測站資料直接來自既有 data/cwa-observations.json
        const DATA_URL = './data/cwa-observations.json';
        const REFRESH_MS = 5 * 60 * 1000;
        let currentScenario = 'monsoon'; // 僅供選擇性風場示意動畫，不代表實測風場
        let selectedStationId = '';
        let windLayerVisible = false;
        let cwaStations = [];
        let cwaUpdatedAt = null;
        let weatherProducts = null;
        const PRODUCTS_URL = './data/weather-products.json';
        const PRODUCTS_REFRESH_MS = 60 * 60 * 1000;

        function toNumber(value) {
            if (value === null || value === undefined || value === '' || value === '-99') return null;
            const n = Number(value);
            return Number.isFinite(n) && n > -90 ? n : null;
        }
        function compassDirection(value) {
            const n = toNumber(value);
            if (n === null) return '未知';
            const dirs = ['北','北北東','東北','東北東','東','東南東','東南','南南東','南','南南西','西南','西南西','西','西北西','北北西'];
            return dirs[Math.round((((n % 360) + 360) % 360) / 22.5) % 16];
        }
        function parseCwaStation(raw) {
            const w = raw.WeatherElement || {};
            const coords = raw.GeoInfo?.Coordinates || [];
            const coord = coords.find(x => String(x.CoordinateName || '').toUpperCase() === 'WGS84')
                || coords.find(x => toNumber(x.StationLatitude) !== null && toNumber(x.StationLongitude) !== null) || {};
            const rainValue = w.Now?.Precipitation ?? raw.RainfallElement?.Now?.Precipitation ?? null;
            const rawDir = w.WindDirection;
            return {
                id: String(raw.StationId || raw.StationID || raw.StationNo || raw.StationName || ''),
                name: raw.StationName || raw.StationNameEN || '未知測站',
                county: raw.GeoInfo?.CountyName || '', town: raw.GeoInfo?.TownName || '',
                coords: [toNumber(coord.StationLatitude), toNumber(coord.StationLongitude)],
                temp: toNumber(w.AirTemperature), humidity: toNumber(w.RelativeHumidity),
                windDir: toNumber(rawDir) === null ? (rawDir || '未知') : compassDirection(rawDir),
                windSpd: toNumber(w.WindSpeed), gust: toNumber(w.GustInfo?.PeakGustSpeed),
                rain: toNumber(rainValue), desc: w.Weather || '無天氣描述',
                obsTime: raw.ObsTime?.DateTime || raw.ObsTime || ''
            };
        }
        function formatObsTime(value) {
            if (!value) return '--';
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString('zh-TW', {timeZone:'Asia/Taipei',hour12:false});
        }// 依據溫度取得發光膠囊顏色
        function getTempColor(temp) {
            if (temp < 18) return { bg: 'rgba(37, 99, 235, 0.85)', border: '#60a5fa', glow: 'rgba(59, 130, 246, 0.7)' };
            if (temp < 22) return { bg: 'rgba(8, 145, 178, 0.85)', border: '#22d3ee', glow: 'rgba(6, 182, 212, 0.7)' };
            if (temp < 26) return { bg: 'rgba(5, 150, 105, 0.85)', border: '#34d399', glow: 'rgba(16, 185, 129, 0.7)' };
            if (temp < 30) return { bg: 'rgba(217, 119, 6, 0.85)', border: '#fbbf24', glow: 'rgba(245, 158, 11, 0.7)' };
            return { bg: 'rgba(225, 29, 72, 0.85)', border: '#fb7185', glow: 'rgba(244, 63, 94, 0.7)' };
        }

        // 內嵌精緻 SVG 天氣圖示生成器
        function getWeatherSvg(desc) {
            if (desc.includes('颱風') || desc.includes('雷')) {
                return `<svg class="w-6 h-6 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M13 13l-2 5h4l-2 5" stroke="#facc15"/></svg>`;
            }
            if (desc.includes('雨')) {
                return `<svg class="w-6 h-6 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 17H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M16 19v2M12 19v3M8 19v2" stroke="#38bdf8" stroke-linecap="round"/></svg>`;
            }
            return `<svg class="w-6 h-6 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4" fill="rgba(251,191,36,0.3)"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
        }// 4. 尚未串接警特報 API 前，不繪製虛構警戒區
        function renderWeatherAlerts() {
            weatherLayers.alerts.clearLayers();
            const host = document.getElementById('alert-marquee');
            if (host) host.innerHTML = '<span class="inline-flex items-center gap-2"><strong class="text-amber-300">警特報資料流尚未串接</strong><span>請以中央氣象署最新公告為準</span><a href="https://www.cwa.gov.tw/V8/C/P/Warning.html" target="_blank" rel="noopener noreferrer" class="text-sky-300 underline">查看官方警特報</a></span>';
        }

                // 5. 繪製中央氣象署真實測站，不使用固定 12 站模擬值
        function renderStationsAndDetails() {
            weatherLayers.stations.clearLayers();
            if (!cwaStations.length) {
                document.getElementById('detail-station-name').textContent = '等待測站資料';
                document.getElementById('detail-weather-desc').textContent = '尚未成功讀取中央氣象署整合資料';
                document.getElementById('detail-temp').textContent = '--';
                return;
            }
            const valid = cwaStations.filter(st =>
                st.coords.every(Number.isFinite) && st.coords[0] >= 17 && st.coords[0] <= 27 &&
                st.coords[1] >= 115 && st.coords[1] <= 126 &&
                (st.temp !== null || st.humidity !== null || st.windSpd !== null || st.rain !== null)
            );
            valid.forEach(st => {
                const hasTemp = st.temp !== null;
                const style = hasTemp ? getTempColor(st.temp) : {bg:'rgba(71,85,105,.9)',border:'#94a3b8',glow:'rgba(148,163,184,.3)'};
                const selected = st.id === selectedStationId;
                const icon = L.divIcon({
                    className:'custom-station-marker',
                    html:'<div class="station-pill ' + (selected?'station-pill-active':'') + ' flex items-center gap-1 px-1.5 py-1 rounded-full text-white text-[10px] font-bold whitespace-nowrap cursor-pointer border" style="background:'+style.bg+';border-color:'+style.border+';box-shadow:0 0 8px '+style.glow+';backdrop-filter:blur(5px)"><span>'+(hasTemp?st.temp.toFixed(1)+'°':'●')+'</span></div>',
                    iconSize:[42,24],iconAnchor:[21,12]
                });
                const marker=L.marker(st.coords,{icon,title:[st.county,st.town,st.name].join(' ')}).addTo(weatherLayers.stations);
                marker.on('click',()=>{selectedStationId=st.id;updateRightDrawerDetails(st);});
                const place=[st.county,st.town].filter(Boolean).join(' ');
                const popup='<div class="p-3.5"><div class="flex items-center justify-between mb-1.5 pr-4"><span class="text-sm font-bold text-white">'+place+' '+st.name+'</span><span class="text-xs font-mono font-bold px-2 py-0.5 rounded-full text-white" style="background:'+style.bg+'">'+(hasTemp?st.temp.toFixed(1)+'°C':'--°C')+'</span></div><div class="text-[10px] text-slate-400 mb-2">觀測時間：'+formatObsTime(st.obsTime)+'</div><div class="text-[11px] text-sky-300 mb-2.5">'+(st.desc||'無天氣描述')+'</div><div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/75 p-2.5 rounded-xl border border-slate-800"><div><span class="text-slate-400">濕度：</span><strong class="font-mono text-sky-300">'+(st.humidity===null?'--':st.humidity+'%')+'</strong></div><div><span class="text-slate-400">風向風速：</span><strong class="text-emerald-300">'+(st.windSpd===null?'--':st.windDir+' '+st.windSpd+'m/s')+'</strong></div><div><span class="text-slate-400">陣風：</span><strong class="font-mono text-amber-300">'+(st.gust===null?'--':st.gust+'m/s')+'</strong></div><div><span class="text-slate-400">雨量：</span><strong class="font-mono text-cyan-300">'+(st.rain===null?'--':st.rain+'mm')+'</strong></div></div></div>';
                marker.bindPopup(popup);
            });
            const active=valid.find(st=>st.id===selectedStationId)||valid.find(st=>st.county.includes('高雄'))||valid[0];
            if(active){selectedStationId=active.id;updateRightDrawerDetails(active);}
            const count=document.getElementById('station-count-label');
            if(count) count.textContent=valid.length.toLocaleString('zh-TW')+' 站';
        }

        function updateRightDrawerDetails(st){
            const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
            set('detail-station-name',[st.county,st.town,st.name].filter(Boolean).join(' '));set('detail-weather-desc',st.desc||'無天氣描述');
            const icon=document.getElementById('detail-weather-icon');if(icon)icon.innerHTML=getWeatherSvg(st.desc||'');
            set('detail-temp',st.temp===null?'--':st.temp.toFixed(1));set('detail-feels-like','未提供');
            set('detail-humidity',st.humidity===null?'--':st.humidity+'%');set('detail-wind',st.windSpd===null?'--':st.windDir+' '+st.windSpd+'m/s');
            set('detail-rain',st.rain===null?'--':st.rain+' mm');set('detail-obs-time','觀測時間：'+formatObsTime(st.obsTime));
            renderEnvironmentForStation(st);renderForecastForStation(st);lucide.createIcons();
        }
        function field(row,...names){
            if(!row||typeof row!=='object')return null;const keys=Object.keys(row);
            for(const n of names){if(row[n]!==undefined&&row[n]!==null&&row[n]!=='')return row[n];const k=keys.find(x=>x.toLowerCase()===n.toLowerCase());if(k&&row[k]!==undefined&&row[k]!=='')return row[k];}return null;
        }
        function num(row,...names){const v=Number(field(row,...names));return Number.isFinite(v)?v:null;}
        function distKm(a,b,c,d){const r=x=>x*Math.PI/180,dy=r(c-a),dx=r(d-b),q=Math.sin(dy/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dx/2)**2;return 6371*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
        function nearest(rows,st,lats,lons){
            if(!Array.isArray(rows)||!st.coords?.every(Number.isFinite))return null;let best=null,dmin=Infinity;
            rows.forEach(row=>{const a=num(row,...lats),b=num(row,...lons);if(a===null||b===null)return;const d=distKm(st.coords[0],st.coords[1],a,b);if(d<dmin){dmin=d;best={row,distance:Math.round(d)};}});
            return best&&dmin<=100?best:null;
        }
        function put(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
        function uvLevel(v){return v<=2?'低量':v<=5?'中量':v<=7?'高量':v<=10?'過量':'危險';}
        function renderEnvironmentForStation(st){
            const a=nearest(weatherProducts?.aqi||[],st,['latitude','Latitude'],['longitude','Longitude']);
            const u=nearest(weatherProducts?.uv||[],st,['wgs84_lat','WGS84_LAT'],['wgs84_lon','WGS84_LON']);
            const ae=document.getElementById('detail-aqi');
            if(a){const v=field(a.row,'aqi','AQI'),status=field(a.row,'status','Status')||'';if(ae){ae.textContent=(v??'--')+' '+status;ae.className='px-1.5 py-0.5 rounded bg-slate-700 text-slate-100 font-mono font-bold';}
                put('detail-aqi-source',(field(a.row,'sitename','SiteName')||'最近 AQI 測站')+' · '+a.distance+' km · '+(field(a.row,'publishtime','PublishTime')||'時間未提供'));
            }else{if(ae)ae.textContent='無附近資料';put('detail-aqi-source','環境部 AQI 尚未載入或附近無有效測站');}
            if(u){const v=num(u.row,'uvi','Uvi');put('detail-uv',v===null?'--':v.toFixed(1)+' '+uvLevel(v));put('detail-uv-source',(field(u.row,'sitename','SiteName')||'最近紫外線測站')+' · '+u.distance+' km · '+(field(u.row,'datacreationdate','DataCreationDate')||'時間未提供'));}
            else{put('detail-uv','無附近資料');put('detail-uv-source','環境部紫外線尚未載入或附近無有效測站');}
        }
        function forecastLocations(){const g=weatherProducts?.forecast?.locations;return Array.isArray(g)?g.flatMap(x=>Array.isArray(x.location)?x.location:[]):[];}
        function norm(v){return String(v||'').replace(/[臺台]/g,'台').replace(/縣|市/g,'').trim();}
        function findForecastLocation(st){const all=forecastLocations(),t=norm(st.town),c=norm(st.county);return all.find(x=>norm(x.locationName)===t&&t)||all.find(x=>norm(x.locationName).includes(t)&&t)||all.find(x=>norm(x.locationName).includes(c)&&c);}
        function series(loc,names){
            const es=loc?.weatherElement||[],el=es.find(x=>names.some(n=>String(x.elementName||'').toLowerCase()===n.toLowerCase()));if(!el)return[];
            return(el.time||[]).map(t=>{const v=Array.isArray(t.elementValue)?t.elementValue[0]:t.elementValue;return{start:t.startTime||t.dataTime||'',value:v?.value??t.value??''};}).filter(x=>x.start);
        }
        function timeLabel(v,day=false){const d=new Date(v);return Number.isNaN(d.getTime())?String(v||'--'):d.toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false,...(day?{month:'numeric',day:'numeric',weekday:'short'}:{hour:'2-digit',minute:'2-digit'})});}
        function nearestTime(arr,t){const x=arr.find(a=>a.start===t);if(x)return x.value;let best=null,delta=Infinity;arr.forEach(a=>{const d=Math.abs(new Date(a.start)-new Date(t));if(d<delta){delta=d;best=a;}});return delta<4*3600000?best?.value:null;}
        function renderForecastForStation(st){
            const loc=findForecastLocation(st),hour=document.getElementById('hourly-chart-container'),week=document.getElementById('weekly-forecast-list');
            if(!loc){if(hour)hour.textContent='尚無法對應此測站鄉鎮的官方預報資料。';if(week)week.textContent='尚無法對應此測站鄉鎮的官方 7 日預報資料。';return;}
            const ts=series(loc,['溫度','平均溫度','Temperature']),wx=series(loc,['天氣現象','天氣預報綜合描述','天氣描述','Weather']),pop=series(loc,['3小時降雨機率','降雨機率','12小時降雨機率','24小時降雨機率','ProbabilityOfPrecipitation']),rh=series(loc,['相對濕度','平均相對濕度','RelativeHumidity']);
            const next=ts.filter(x=>new Date(x.start).getTime()>=Date.now()-3600000).slice(0,24);
            if(hour){if(!next.length)hour.textContent='目前沒有可用的逐時溫度資料，不以其他時段資料補造逐時數值。';else hour.innerHTML='<div class="flex gap-2 min-w-max pb-2">'+next.map(x=>{const t=Number(x.value),p=nearestTime(pop,x.start),w=nearestTime(wx,x.start),r=nearestTime(rh,x.start);return'<div class="w-[76px] shrink-0 rounded-xl bg-slate-950/70 border border-slate-800 p-2 text-center"><div class="text-[10px] text-slate-400">'+timeLabel(x.start)+'</div><div class="text-lg font-bold text-amber-300 mt-1">'+(Number.isFinite(t)?t.toFixed(0)+'°':'--')+'</div><div class="text-[10px] text-slate-300 truncate mt-1">'+(w||'預報')+'</div><div class="text-[10px] text-sky-300 mt-1">雨 '+(p!==null&&p!==''?p+'%':'--')+'</div>'+(r!==null?'<div class="text-[10px] text-slate-500">濕度 '+r+'%</div>':'')+'</div>';}).join('')+'</div><div class="text-[10px] text-slate-500">中央氣象署鄉鎮逐時預報</div>';}
            const max=series(loc,['最高溫度','MaxTemperature','MaxT']),min=series(loc,['最低溫度','MinTemperature','MinT']),days=new Map();
            [...max,...min,...wx].forEach(x=>{const d=new Date(x.start);if(Number.isNaN(d.getTime()))return;const k=d.toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'});if(!days.has(k))days.set(k,{date:k,max:null,min:null,weather:''});const o=days.get(k),v=Number(x.value);if(max.includes(x)&&Number.isFinite(v))o.max=o.max===null?v:Math.max(o.max,v);if(min.includes(x)&&Number.isFinite(v))o.min=o.min===null?v:Math.min(o.min,v);if(wx.includes(x)&&!o.weather&&x.value)o.weather=x.value;});
            const list=[...days.values()].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,7);
            if(week){if(!list.length)week.textContent='此鄉鎮目前沒有可用的 7 日最高／最低溫預報資料。';else week.innerHTML=list.map(x=>'<div class="flex items-center gap-2 py-2 border-b border-slate-800/80 last:border-0"><span class="w-16 shrink-0 text-slate-300">'+timeLabel(x.date+'T12:00:00+08:00',true)+'</span><span class="flex-1 truncate text-slate-400">'+(x.weather||'官方預報')+'</span><span class="text-sky-300 font-mono">'+(x.min===null?'--':x.min.toFixed(0)+'°')+'</span><span class="text-amber-300 font-mono">'+(x.max===null?'--':x.max.toFixed(0)+'°')+'</span></div>').join('')+'<div class="text-[10px] text-slate-500 mt-1">中央氣象署鄉鎮 7 日預報 · 每 6 小時更新</div>';}
        }
        async function loadWeatherProducts(showMessage=false){
            try{const r=await fetch(PRODUCTS_URL+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json();if(!p?.success||!p.forecast?.locations)throw Error('預報資料格式不正確');weatherProducts=p;
                if(cwaStations.length){const st=cwaStations.find(x=>x.id===selectedStationId)||cwaStations[0];if(st)updateRightDrawerDetails(st);}
                const status=document.getElementById('scenario-status-text');if(status)status.title='預報、AQI 與紫外線更新：'+formatObsTime(p.updatedAt);
                if(showMessage)showToast('已更新 24 小時／7 日預報、AQI 與紫外線資料');
            }catch(err){console.error('預報與環境資料載入失敗',err);if(showMessage)showToast('預報或環境資料更新失敗，請稍後再試');}
        }

                // 6. HTML5 Canvas 動態風場流線粒子系統 (Wind Streamlines)
        const windCanvas = document.getElementById('wind-canvas');
        const windCtx = windCanvas.getContext('2d');
        let particles = [];
        const PARTICLE_COUNT = 260;

        function resizeWindCanvas() {
            windCanvas.width = window.innerWidth;
            windCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeWindCanvas);
        resizeWindCanvas();

        function initWindParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * windCanvas.width,
                    y: Math.random() * windCanvas.height,
                    age: Math.floor(Math.random() * 90),
                    maxAge: 65 + Math.floor(Math.random() * 55),
                    speedFactor: 0.75 + Math.random() * 0.6
                });
            }
        }
        initWindParticles();

        // 計算螢幕像素座標處的風場向量 (vx, vy)
        function getWindVector(x, y) {
            if (currentScenario === 'monsoon') {
                // 東北季風：由東北吹向西南，並受中央山脈地形產生微幅繞流波動
                const wave = Math.sin(y * 0.008 + x * 0.005) * 0.45;
                return { vx: -2.1 + wave, vy: 2.3 + wave * 0.6 };
            } else if (currentScenario === 'meiyu') {
                // 夏季西南氣流：由西南吹向東北
                const wave = Math.cos(x * 0.007) * 0.5;
                return { vx: 2.2 + wave, vy: -2.0 + wave * 0.5 };
            } else {
                // 颱風逆時針環流 (渦旋中心投影於地圖東南外海座標)
                const centerLatLng = [22.35 + (0 / 60) * 0.35, 121.95 - (0 / 60) * 0.42];
                const centerPx = map.latLngToContainerPoint(centerLatLng);
                const dx = x - centerPx.x;
                const dy = y - centerPx.y;
                const dist = Math.sqrt(dx * dx + dy * dy) + 1;
                // 逆時針切線向量 (dy, -dx) 加上微幅向內輻合吸力
                const speed = Math.min(5.2, Math.max(1.8, 420 / (dist + 60)));
                const vx = (dy / dist) * speed - (dx / dist) * 0.35;
                const vy = (-dx / dist) * speed - (dy / dist) * 0.35;
                return { vx, vy };
            }
        }

        function animateWindStreamlines() {
            if (!windLayerVisible) {
                windCtx.clearRect(0, 0, windCanvas.width, windCanvas.height);
                requestAnimationFrame(animateWindStreamlines);
                return;
            }

            // 漸隱拖尾效果，營造流暢風場絲線感
            windCtx.globalCompositeOperation = 'destination-in';
            windCtx.fillStyle = 'rgba(0, 0, 0, 0.91)';
            windCtx.fillRect(0, 0, windCanvas.width, windCanvas.height);

            windCtx.globalCompositeOperation = 'lighter';
            windCtx.lineWidth = 1.45;

            particles.forEach(p => {
                const prevX = p.x;
                const prevY = p.y;
                const vec = getWindVector(p.x, p.y);

                p.x += vec.vx * p.speedFactor;
                p.y += vec.vy * p.speedFactor;
                p.age++;

                const lifeRatio = 1 - Math.abs((p.age / p.maxAge) * 2 - 1);
                const strokeColor = currentScenario === 'typhoon'
                    ? `rgba(244, 114, 182, ${lifeRatio * 0.55})`
                    : `rgba(56, 189, 248, ${lifeRatio * 0.52})`;

                windCtx.beginPath();
                windCtx.strokeStyle = strokeColor;
                windCtx.moveTo(prevX, prevY);
                windCtx.lineTo(p.x, p.y);
                windCtx.stroke();

                // 粒子生命週期結束或超出邊界時重生
                if (p.age >= p.maxAge || p.x < 0 || p.x > windCanvas.width || p.y < 0 || p.y > windCanvas.height) {
                    p.x = Math.random() * windCanvas.width;
                    p.y = Math.random() * windCanvas.height;
                    p.age = 0;
                }
            });

            requestAnimationFrame(animateWindStreamlines);
        }

        // 7. 互動控制函式
        function setWeatherScenario() { showToast('此版僅顯示真實觀測資料，不提供模擬天氣情境'); }

                function toggleWeatherLayer(layerKey, isVisible) {
            if (layerKey === 'satellite' || layerKey === 'radar') return;
            if (layerKey === 'wind') {
                windLayerVisible = isVisible;
                if (isVisible) animateWindStreamlines();
                return;
            }
            if (!weatherLayers[layerKey]) return;
            if (isVisible) map.addLayer(weatherLayers[layerKey]); else map.removeLayer(weatherLayers[layerKey]);
        }

        function flyToRegion(regionKey, btnEl) {
            const preset = regionPresets[regionKey];
            if (!preset) return;
            map.flyTo(preset.center, preset.zoom, { duration: 1.3 });

            document.querySelectorAll('.region-btn').forEach(btn => {
                const isFull = btn.classList.contains('col-span-3') && btn.textContent.includes('全台灣');
                btn.className = `region-btn ${isFull ? 'col-span-3 px-2.5' : (btn.classList.contains('col-span-3') ? 'col-span-3 px-2.5' : 'px-2')} py-1.5 rounded-xl text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition cursor-pointer`;
            });
            if (btnEl) {
                const isFull = btnEl.classList.contains('col-span-3');
                btnEl.className = `region-btn ${isFull ? 'col-span-3 px-2.5' : 'px-2'} py-1.5 rounded-xl text-xs font-semibold bg-sky-500/20 text-sky-300 border border-sky-400/50 transition cursor-pointer`;
            }

            if (regionKey === 'south') {
                selectedStationId = 'KHH-SM';
                renderStationsAndDetails();
            }
            showToast(`視角已移動至：${preset.label}`);
        }// 左右懸浮面板收合控制
        let leftOpen = true;
        function toggleLeftPanel() {
            const panel = document.getElementById('left-panel');
            const expandBtn = document.getElementById('left-panel-expand-btn');
            leftOpen = !leftOpen;
            if (leftOpen) {
                panel.classList.remove('-translate-x-[120%]', 'opacity-0', 'pointer-events-none');
                expandBtn.classList.add('hidden');
                expandBtn.classList.remove('flex');
            } else {
                panel.classList.add('-translate-x-[120%]', 'opacity-0', 'pointer-events-none');
                expandBtn.classList.remove('hidden');
                expandBtn.classList.add('flex');
            }
        }

        let rightOpen = true;
        function toggleRightDrawer() {
            const drawer = document.getElementById('right-drawer');
            const expandBtn = document.getElementById('right-drawer-expand-btn');
            rightOpen = !rightOpen;
            if (rightOpen) {
                drawer.classList.remove('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
                expandBtn.classList.add('hidden');
                expandBtn.classList.remove('flex');
            } else {
                drawer.classList.add('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
                expandBtn.classList.remove('hidden');
                expandBtn.classList.add('flex');
            }
        }

        function openApiModal(){document.getElementById('api-modal').classList.remove('hidden');}
        function closeApiModal(){document.getElementById('api-modal').classList.add('hidden');}

        function updateObsClock(){
            const el=document.getElementById('obs-clock');
            if(el) el.textContent=cwaUpdatedAt?formatObsTime(cwaUpdatedAt):'--';
        }
        async function loadCwaObservations(showMessage=false){
            const icon=document.getElementById('refresh-spin-icon');
            if(icon) icon.classList.add('animate-spin');
            try{
                const response=await fetch(DATA_URL+'?_='+Date.now(),{cache:'no-store'});
                if(!response.ok) throw new Error('HTTP '+response.status);
                const payload=await response.json();
                if(!payload||payload.success!==true||!Array.isArray(payload.stations)) throw new Error('整合測站資料格式不正確');
                cwaStations=payload.stations.map(parseCwaStation);
                cwaUpdatedAt=payload.updatedAt||null;
                updateObsClock();
                renderStationsAndDetails();
                const status=document.getElementById('scenario-status-text');
                if(status){status.textContent='● CWA 即時觀測｜'+cwaStations.length.toLocaleString('zh-TW')+' 站';status.className='text-emerald-400 font-medium';}
                const clock=document.getElementById('obs-clock');
                if(clock) clock.title='整合資料更新時間：'+formatObsTime(cwaUpdatedAt);
                if(showMessage) showToast('已更新 '+cwaStations.length.toLocaleString('zh-TW')+' 站中央氣象署觀測資料');
            }catch(error){
                console.error('CWA 測站資料載入失敗：',error);
                const status=document.getElementById('scenario-status-text');
                if(status){status.textContent='● CWA 資料讀取失敗';status.className='text-rose-400 font-medium';}
                if(showMessage) showToast('測站資料更新失敗，請稍後再試');
            }finally{if(icon)icon.classList.remove('animate-spin');}
        }
        function manualRefreshData(){loadCwaObservations(true);loadWeatherProducts(true);}

                let toastTimer;
        function showToast(msg) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-text').textContent = msg;
            box.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => box.classList.add('opacity-0'), 2500);
        }

        // 啟動地圖、測站、鄉鎮預報與環境資料更新
        window.onload=async function(){
            if(window.innerWidth<1024){toggleLeftPanel();toggleRightDrawer();}
            renderWeatherAlerts();
            await loadCwaObservations();
            await loadWeatherProducts();
            setInterval(loadCwaObservations,REFRESH_MS);
            setInterval(loadWeatherProducts,PRODUCTS_REFRESH_MS);
        };
    </script>
