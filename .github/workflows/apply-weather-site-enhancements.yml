name: Apply Xuan Weather site enhancements # one-time dashboard enhancement
on:
  push:
    paths:
      - '.github/workflows/apply-weather-site-enhancements.yml'
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add live weather intelligence modules
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          if 'id="live-rankings"' in s:
              print("Enhancements already present")
              raise SystemExit(0)
          nav_old = '''      <button class="active">總覽</button>
                <button>全台觀測</button>
                <button>雷達衛星</button>
                <button>預報資訊</button>
                <button>颱風地震</button>'''
          nav_new = '''      <button class="active">總覽</button>
                <button>全台觀測</button>
                <button>即時排行</button>
                <button>雷達衛星</button>
                <button>預報資訊</button>
                <button>颱風地震</button>'''
          if nav_old not in s:
              raise SystemExit("Navigation anchor not found; refusing to modify")
          s = s.replace(nav_old, nav_new, 1)
          markup = """
          <section class="xuan-insights" id="live-rankings" aria-label="全台即時氣象分析">
            <div class="xuan-section-heading"><div><span class="xuan-kicker">LIVE WEATHER INTELLIGENCE</span><h2>即時氣象排行與區域分析</h2><p>依測站最新有效觀測值排序；非日累積或預報值</p></div><span class="xuan-live-pill"><i></i> 測站即時統計</span></div>
            <div class="xuan-insight-grid">
              <article class="xuan-insight-card"><div class="xuan-insight-title"><div><b>🏆 全台即時排行榜</b><small>Top 10 測站</small></div><span class="xuan-mini-tag">觀測值</span></div>
                <div class="xuan-rank-tabs" role="group" aria-label="選擇排行榜">
                  <button type="button" class="active" data-rank="hot">高溫</button><button type="button" data-rank="cold">低溫</button><button type="button" data-rank="gust">陣風</button><button type="button" data-rank="rain">雨量</button><button type="button" data-rank="wind">風速</button>
                </div><div id="xuan-ranking-list" class="xuan-ranking-list">等待測站資料載入</div>
              </article>
              <article class="xuan-insight-card"><div class="xuan-insight-title"><div><b>🧭 全台區域觀測</b><small>各區有效測站平均氣溫</small></div><span class="xuan-mini-tag">即時平均</span></div><div id="xuan-region-list" class="xuan-region-list">等待測站資料載入</div><p class="xuan-insight-note">區域平均僅計入具有有效氣溫數值的測站。</p></article>
              <article class="xuan-insight-card"><div class="xuan-insight-title"><div><b>📡 自動觀測快報</b><small>由最新測站數據自動整理</small></div><span class="xuan-mini-tag">資料驅動</span></div><div id="xuan-weather-brief" class="xuan-weather-brief">等待測站資料載入</div><div class="xuan-data-coverage" id="xuan-data-coverage">資料涵蓋率：等待計算</div></article>
            </div>
          </section>
          """
          title_pos = s.find("監測圖資入口")
          if title_pos < 0:
              raise SystemExit("Content insertion anchor not found; refusing to modify")
          anchor_pos = s.rfind("  <!--", 0, title_pos)
          if anchor_pos < 0:
              raise SystemExit("Content insertion marker not found")
          s = s[:anchor_pos] + markup + "\n" + s[anchor_pos:]
          css = """
          /* Live ranking and regional analysis */
          .xuan-insights{margin:24px 0 28px}.xuan-insight-grid{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(2,minmax(0,1fr));gap:14px}
          .xuan-insight-card{min-width:0;padding:19px;border:1px solid #e0e9f4;border-radius:20px;background:#fff;box-shadow:0 10px 28px #132d4e0e}
          .xuan-insight-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.xuan-insight-title b{display:block;color:#1b3556;font-size:15px}.xuan-insight-title small{display:block;color:#8291a5;font-size:10px;margin-top:4px}
          .xuan-mini-tag{padding:5px 8px;border-radius:999px;background:#eff6ff;color:#4773a4;font-size:9px;font-weight:800;white-space:nowrap}
          .xuan-rank-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}.xuan-rank-tabs button{flex:0 0 auto;border:1px solid #dce6f1;border-radius:999px;background:#f7faff;color:#60758e;padding:7px 11px;font-size:11px;font-weight:750}.xuan-rank-tabs button.active{background:#1d5d9c;border-color:#1d5d9c;color:#fff}
          .xuan-ranking-list,.xuan-region-list,.xuan-weather-brief{display:grid;gap:7px}.xuan-rank-row{display:grid;grid-template-columns:25px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px 7px;border-bottom:1px solid #edf2f7}.xuan-rank-number{display:grid;place-items:center;width:23px;height:23px;border-radius:8px;background:#eff4fa;color:#60758e;font-size:10px;font-weight:850}.xuan-rank-row:nth-child(-n+3) .xuan-rank-number{background:#e5f1ff;color:#1d5d9c}
          .xuan-rank-station{min-width:0}.xuan-rank-station b{display:block;color:#29415f;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xuan-rank-station small{display:block;color:#91a0b3;font-size:10px;margin-top:3px}.xuan-rank-value{color:#1c4772;font-size:14px;font-weight:850;white-space:nowrap;font-variant-numeric:tabular-nums}
          .xuan-region-row{display:grid;grid-template-columns:48px minmax(0,1fr) 55px;align-items:center;gap:8px}.xuan-region-name{color:#526982;font-size:11px;font-weight:750}.xuan-region-track{height:9px;border-radius:999px;background:#edf3f9;overflow:hidden}.xuan-region-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#56a9dc,#2873b8)}.xuan-region-value{text-align:right;color:#294b70;font-size:12px;font-weight:850}
          .xuan-insight-note{margin:14px 0 0;color:#8a9bb0;font-size:10px;line-height:1.6}.xuan-brief-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:12px;background:#f5f8fc;color:#536a83;font-size:11px;line-height:1.6}.xuan-brief-item strong{color:#24496f}
          .xuan-data-coverage{margin-top:12px;padding-top:10px;border-top:1px solid #eaf0f6;color:#8495aa;font-size:10px;line-height:1.6}
          body:not(.light) .xuan-insight-card{background:#122238;border-color:#29415e;color:#e7f0fb}body:not(.light) .xuan-insight-title b,body:not(.light) .xuan-rank-station b,body:not(.light) .xuan-rank-value,body:not(.light) .xuan-region-value{color:#e7f0fb}body:not(.light) .xuan-insight-title small,body:not(.light) .xuan-rank-station small,body:not(.light) .xuan-insight-note,body:not(.light) .xuan-data-coverage{color:#9aadc5}body:not(.light) .xuan-rank-row{border-color:#293f58}body:not(.light) .xuan-rank-number,body:not(.light) .xuan-mini-tag{background:#1b3553;color:#c5def8}body:not(.light) .xuan-rank-tabs button{background:#172b44;border-color:#304963;color:#c3d3e5}body:not(.light) .xuan-rank-tabs button.active{background:#28649c;border-color:#28649c;color:#fff}body:not(.light) .xuan-region-track{background:#263d57}body:not(.light) .xuan-brief-item{background:#172b44;color:#bdcde0}body:not(.light) .xuan-brief-item strong{color:#d8eaff}
          @media(max-width:1000px){.xuan-insight-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.xuan-insight-card:first-child{grid-column:1/-1}}@media(max-width:600px){.xuan-insight-grid{grid-template-columns:1fr}.xuan-insight-card:first-child{grid-column:auto}.xuan-insight-card{padding:15px}.xuan-rank-row{padding:8px 3px}}
          """
          style_anchor = "</head>"
          if style_anchor not in s: raise SystemExit("Head anchor not found")
          s = s.replace(style_anchor, '<style id="xuan-live-insights-style">\n'+css+'\n</style>\n'+style_anchor, 1)
          js = """
          /* Live rankings, regional comparison and observation briefing */
          let currentRanking='hot';
          const XUAN_REGIONS=[
            {name:'北部',counties:['臺北市','台北市','新北市','基隆市','桃園市','新竹市','新竹縣','宜蘭縣']},
            {name:'中部',counties:['苗栗縣','臺中市','台中市','彰化縣','南投縣','雲林縣']},
            {name:'南部',counties:['嘉義市','嘉義縣','臺南市','台南市','高雄市','屏東縣']},
            {name:'東部',counties:['花蓮縣','臺東縣','台東縣']},
            {name:'離島',counties:['澎湖縣','金門縣','連江縣']}
          ];
          const XUAN_RANK_CONFIG={hot:{key:'temperature',unit:'°C',descending:true},cold:{key:'temperature',unit:'°C',descending:false},gust:{key:'gust',unit:'m/s',descending:true},rain:{key:'rain',unit:'mm',descending:true},wind:{key:'wind',unit:'m/s',descending:true}};
          function renderLiveRankings(){
            const host=document.getElementById('xuan-ranking-list');if(!host)return;
            const cfg=XUAN_RANK_CONFIG[currentRanking]||XUAN_RANK_CONFIG.hot;
            const rows=stations.filter(x=>Number.isFinite(x[cfg.key])).sort((a,b)=>cfg.descending?b[cfg.key]-a[cfg.key]:a[cfg.key]-b[cfg.key]).slice(0,10);
            host.innerHTML=rows.length?rows.map((x,i)=>'<div class="xuan-rank-row"><span class="xuan-rank-number">'+(i+1)+'</span><div class="xuan-rank-station"><b>'+safe(x.name)+'</b><small>'+safe(x.county)+' '+safe(x.town)+'</small></div><span class="xuan-rank-value">'+fmt(x[cfg.key],1)+' '+cfg.unit+'</span></div>').join(''):'<div>目前沒有可用的有效觀測值</div>';
            document.querySelectorAll('[data-rank]').forEach(b=>{const active=b.dataset.rank===currentRanking;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
          }
          function renderRegionalComparison(){
            const host=document.getElementById('xuan-region-list');if(!host)return;
            const rows=XUAN_REGIONS.map(region=>{const members=stations.filter(x=>region.counties.includes(x.county)&&Number.isFinite(x.temperature));return {...region,count:members.length,average:members.length?members.reduce((a,x)=>a+x.temperature,0)/members.length:null};}).filter(x=>x.count);
            if(!rows.length){host.textContent='目前沒有足夠的區域氣溫資料';return;}
            const vals=rows.map(x=>x.average),min=Math.min(...vals),span=Math.max(1,Math.max(...vals)-min);
            host.innerHTML=rows.map(x=>'<div class="xuan-region-row"><span class="xuan-region-name">'+x.name+'</span><div class="xuan-region-track"><div class="xuan-region-fill" style="width:'+(18+(x.average-min)/span*82)+'%"></div></div><span class="xuan-region-value">'+x.average.toFixed(1)+'°C</span></div>').join('');
          }
          function renderWeatherBrief(){
            const host=document.getElementById('xuan-weather-brief');if(!host)return;
            const t=stations.filter(x=>Number.isFinite(x.temperature)),g=stations.filter(x=>Number.isFinite(x.gust)),r=stations.filter(x=>Number.isFinite(x.rain));
            const hot=[...t].sort((a,b)=>b.temperature-a.temperature)[0],cold=[...t].sort((a,b)=>a.temperature-b.temperature)[0],gust=[...g].sort((a,b)=>b.gust-a.gust)[0],rain=[...r].sort((a,b)=>b.rain-a.rain)[0];
            const items=[];if(hot)items.push(['🌡️','目前最高氣溫',hot.county+' '+hot.name+' '+fmt(hot.temperature)+'°C']);if(cold)items.push(['❄️','目前最低氣溫',cold.county+' '+cold.name+' '+fmt(cold.temperature)+'°C']);if(gust)items.push(['💨','目前最大陣風',gust.county+' '+gust.name+' '+fmt(gust.gust)+' m/s']);if(rain)items.push(['🌧️','目前最大瞬時雨量',rain.county+' '+rain.name+' '+fmt(rain.rain)+' mm']);
            host.innerHTML=items.map(([icon,label,value])=>'<div class="xuan-brief-item"><span>'+icon+'</span><div><strong>'+label+'</strong><br>'+safe(value)+'</div></div>').join('')||'目前沒有足夠資料產生觀測快報';
            const coverage=document.getElementById('xuan-data-coverage');if(coverage)coverage.textContent='資料概況：整合測站 '+stations.length+' 站｜氣溫有效 '+t.length+' 站｜陣風有效 '+g.length+' 站｜雨量有效 '+r.length+' 站';
          }
          function renderWeatherInsights(){renderLiveRankings();renderRegionalComparison();renderWeatherBrief();}
          document.addEventListener('click',event=>{const button=event.target.closest('[data-rank]');if(!button)return;currentRanking=button.dataset.rank;renderLiveRankings();});
          """
          js_anchor = "/* 讀取官方整合資料 */"
          if js_anchor not in s: raise SystemExit("JavaScript anchor not found")
          s = s.replace(js_anchor, js + "\n" + js_anchor, 1)
          call_anchor = "    renderXuanHighlights();"
          if call_anchor not in s: raise SystemExit("Data render anchor not found")
          s = s.replace(call_anchor, call_anchor+"\n    renderWeatherInsights();", 1)
          nav_anchor = "const navTargets = ['overview','live-weather','weather-maps','hourly-forecast','alerts-forecast'];"
          if nav_anchor not in s: raise SystemExit("Navigation targets anchor not found")
          s = s.replace(nav_anchor, "const navTargets = ['overview','live-weather','live-rankings','weather-maps','hourly-forecast','alerts-forecast'];", 1)
          p.write_text(s, encoding="utf-8")
          print("Enhanced index.html; original data sources and refresh interval remain unchanged.")
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/xuan-weather-main.js').write_text(blocks[0],encoding='utf-8')
          PY
          node --check /tmp/xuan-weather-main.js
      - name: Commit enhanced site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enhance weather site with live rankings and regional insights" || echo "No changes to commit"
          git push
