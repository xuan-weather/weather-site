name: CWA Observations Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: cwa-observations
  cancel-in-progress: false

jobs:
  update-observations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch CWA observations
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/fetch_observations.py

      - name: Commit updated CWA datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cwa-O-A0001-001.json data/cwa-O-A0002-001.json data/cwa-O-A0003-001.json
          if git diff --cached --quiet; then
            echo "資料內容沒有變更，不需要提交"
          else
            git commit -m "Update CWA observation datasets"
            git push
          fi
